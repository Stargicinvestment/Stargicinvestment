
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0f1a;
  color:white;
}

.header{
  padding:15px;
  background:#111827;
  display:flex;
  justify-content:space-between;
}

.container{
  padding:15px;
}

.card{
  background:#1f2937;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  margin-top:5px;
}

.add{background:#22c55e;}
.delete{background:#ef4444;}

input{
  padding:8px;
  border-radius:5px;
  border:none;
  width:120px;
}
</style>
</head>

<body>

<div class="header">
  <h2>Admin Dashboard</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

  <div id="status">Checking admin...</div>

  <h3>All Users</h3>
  <div id="usersList"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { 
  getFirestore, doc, getDoc, collection, getDocs, 
  updateDoc, deleteDoc, addDoc   // ✅ FIXED (IMPORTANT)
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();


// ✅ ADMIN CHECK
onAuthStateChanged(auth, async (user) => {

  if(!user){
    document.getElementById("status").innerText = "Not logged in";
    return;
  }

  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    document.getElementById("status").innerText = "User data not found";
    return;
  }

  const data = snap.data();

  if(!data.admin){
    document.getElementById("status").innerText = "Access Denied ❌";
    return;
  }

  document.getElementById("status").innerText = "Welcome Admin ✅";

  loadUsers();
});


// ✅ ADD BALANCE (FINAL FIXED)
async function addBalance(userId, amount) {

  const userRef = doc(db, "users", userId);
  const snap = await getDoc(userRef);
  const data = snap.data();

  const currentBalance = Number(data.balance) || 0;
  const currentInvested = Number(data.invested) || 0;
  const currentProfit = Number(data.profit) || 0;

  const plan = data.plan;

  // ✅ SAVE DEPOSIT TRANSACTION
  await addDoc(collection(db,"transactions"),{
    userId: userId,
    type: "deposit",
    amount: amount,
    time: Date.now()
  });

  // If no plan yet
  if (!plan || !currentInvested) {
    await updateDoc(userRef, {
      balance: currentBalance + amount,
      invested: currentInvested + amount,
      lastUpdate: Date.now()
    });
    return;
  }

  const plans = {
    starter: { rate: 0.025 },
    silver: { rate: 0.035 },
    gold: { rate: 0.045 },
    platinum: { rate: 0.055 },
    vip: { rate: 0.066 }
  };

  const planData = plans[plan];

  const now = Date.now();
  const last = data.lastUpdate ? Number(data.lastUpdate) : now;

  const hours = (now - last) / (1000 * 60 * 60);

  let earned = currentInvested * planData.rate * (hours / 24);

  if (!isFinite(earned) || earned < 0) earned = 0;

  await updateDoc(userRef, {
    balance: currentBalance + amount,
    invested: currentInvested + amount,
    profit: currentProfit + earned,
    lastUpdate: now
  });
}


// ✅ LOAD USERS
async function loadUsers(){

  const list = document.getElementById("usersList");
  list.innerHTML = "Loading...";

  const snapshot = await getDocs(collection(db, "users"));

  let html = "";

  snapshot.forEach((docSnap) => {

    const u = docSnap.data();
    const id = docSnap.id;

    html += `
      <div class="card">
        <p><b>Email:</b> ${u.email || "N/A"}</p>
        <p><b>Balance:</b> $${Number(u.balance || 0).toFixed(2)}</p>
        <p><b>Invested:</b> $${Number(u.invested || 0).toFixed(2)}</p>
        <p><b>Plan:</b> ${u.plan || "None"}</p>

        <input type="number" id="bal-${id}" placeholder="Add amount">

        <br>
        <button class="add" onclick="updateBalance('${id}')">Add Balance</button>
        <button class="delete" onclick="deleteUser('${id}')">Delete</button>
      </div>
    `;
  });

  list.innerHTML = html;
}


// ✅ BUTTON HANDLER
window.updateBalance = async function(id){

  const input = document.getElementById(`bal-${id}`);
  const amount = Number(input.value);

  if(isNaN(amount) || amount <= 0){
    alert("Enter valid amount");
    return;
  }

  await addBalance(id, amount);

  alert("Balance added successfully");

  input.value = ""; // ✅ IMPORTANT FIX

  loadUsers();
}


// ✅ DELETE USER
window.deleteUser = async function(id){

  if(!confirm("Delete user?")) return;

  await deleteDoc(doc(db,"users",id));

  alert("User deleted");
  loadUsers();
}


// ✅ LOGOUT
window.logout = function(){
  signOut(auth);
  location.href = "login.html";
}

</script>

</body>
</html>
