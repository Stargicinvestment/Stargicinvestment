<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>

  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0f1a;
  color:white;
}

.header{
  padding:15px;
  background:#111827;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:#1f2937;
  padding:16px;
  margin-bottom:12px;
  border-radius:12px;
}

button{
  padding:9px 13px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-top:6px;
}

.add{
  background:#22c55e;
  color:#000;
}

.delete{
  background:#ef4444;
  color:white;
}

.approve{
  background:#22c55e;
  color:#000;
}

.reject{
  background:#ef4444;
  color:white;
}

.copy{
  background:#374151;
  color:white;
}

input{
  padding:10px;
  border-radius:6px;
  border:none;
  width:140px;
}

.small{
  color:#9ca3af;
  font-size:13px;
}

.green{
  color:#4ade80;
}

.yellow{
  color:#facc15;
}

.blue{
  color:#60a5fa;
}
</style>
</head>

<body>

<div class="header">
  <h2>Demo Admin</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

  <div class="card">
    <b>Simulation Mode</b>
    <p class="small">
      This dashboard controls simulated/demo balances and profits.
    </p>
    <div id="status">Checking admin...</div>
  </div>

  <h3>Users</h3>
  <div id="usersList"></div>

  <h3>Withdraw Requests</h3>
  <div id="withdrawList"></div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc,
  updateDoc,
  deleteDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================================
   FIREBASE
================================ */

const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);


/* ================================
   PLAN SYSTEM
================================ */

function getPlan(total){

  total = Number(total) || 0;

  if(total >= 100000){
    return {
      name:"VIP",
      rate:0.04
    };
  }

  if(total >= 50000){
    return {
      name:"Premium",
      rate:0.035
    };
  }

  if(total >= 10000){
    return {
      name:"Elite",
      rate:0.03
    };
  }

  if(total >= 2000){
    return {
      name:"Silver",
      rate:0.025
    };
  }

  return {
    name:"Basic",
    rate:0.02
  };
}


/* ================================
   TIME
================================ */

const DAY = 24 * 60 * 60 * 1000;
const CYCLE = 7 * DAY;


/* ================================
   FINALIZE CURRENT PROFIT
================================ */

async function finalizeCurrentProfit(data, now){

  const invested =
    Number(data.invested || 0);

  const rate =
    Number(data.rate || 0);

  let availableProfit =
    Number(data.availableProfit || 0);

  let lockedProfit =
    Number(data.lockedProfit || 0);

  let cycleStart =
    Number(
      data.cycleStart ||
      data.profitStart ||
      0
    );

  if(
    invested <= 0 ||
    rate <= 0 ||
    cycleStart <= 0
  ){
    return {
      availableProfit,
      lockedProfit,
      cycleStart: now
    };
  }


  if(cycleStart > now){
    cycleStart = now;
  }


  const elapsed =
    now - cycleStart;

  const completedCycles =
    Math.floor(elapsed / CYCLE);


  /*
    Every completed 7-day cycle
    becomes withdrawable.
  */

  if(completedCycles > 0){

    const cycleProfit =
      invested *
      rate *
      7;

    availableProfit +=
      cycleProfit * completedCycles;

    cycleStart +=
      completedCycles * CYCLE;

    lockedProfit = 0;
  }


  /*
    Profit currently inside
    the unfinished cycle.
  */

  const currentElapsed =
    Math.max(
      0,
      now - cycleStart
    );

  const currentDays =
    currentElapsed / DAY;

  lockedProfit =
    invested *
    rate *
    currentDays;


  return {
    availableProfit,
    lockedProfit,
    cycleStart
  };
}


/* ================================
   ADD DEMO BALANCE
================================ */

async function addBalance(userId, amount){

  const userRef =
    doc(db,"users",userId);

  const snap =
    await getDoc(userRef);

  if(!snap.exists()){
    throw new Error("User not found");
  }

  const data =
    snap.data();

  const oldInvested =
    Number(data.invested || 0);

  const oldBalance =
    Number(data.balance || 0);

  const now =
    Date.now();


  /*
    First calculate all profit earned
    by the OLD capital.
  */

  const finalized =
    await finalizeCurrentProfit(
      data,
      now
    );


  /*
    Add the new capital.
  */

  const newInvested =
    oldInvested + amount;

  const newBalance =
    oldBalance + amount;


  /*
    Determine the plan from the
    TOTAL invested amount.
  */

  const plan =
    getPlan(newInvested);


  /*
    New total capital starts
    a fresh cycle at the current time.
  */

  await updateDoc(userRef,{

    balance:newBalance,

    invested:newInvested,

    plan:plan.name,

    rate:plan.rate,

    cycleStart:now,

    profitStart:now,

    lastUpdate:now,

    availableProfit:
      Number(
        finalized.availableProfit.toFixed(8)
      ),

    lockedProfit:0
  });


  /*
    Transaction record.
  */

  await addDoc(
    collection(db,"transactions"),
    {
      userId:userId,
      type:"deposit",
      amount:amount,
      time:now,
      demo:true
    }
  );
}


/* ================================
   LOAD USERS
================================ */

function loadUsers(){

  const list =
    document.getElementById(
      "usersList"
    );

  onSnapshot(
    collection(db,"users"),
    snapshot=>{

      let html = "";

      snapshot.forEach(docSnap=>{

        const u =
          docSnap.data();

        const id =
          docSnap.id;

        if(u.admin){
          return;
        }

        const invested =
          Number(u.invested || 0);

        const balance =
          Number(u.balance || 0);

        const available =
          Number(
            u.availableProfit || 0
          );

        const locked =
          Number(
            u.lockedProfit || 0
          );

        const rate =
          Number(u.rate || 0) * 100;


        html += `

        <div class="card">

          <p>
            <b>Email:</b>
            ${u.email || "N/A"}
          </p>

          <p>
            <b>Balance:</b>
            <span class="green">
              $${balance.toFixed(2)}
            </span>
          </p>

          <p>
            <b>Capital Locked:</b>
            <span class="blue">
              $${invested.toFixed(2)}
            </span>
          </p>

          <p>
            <b>Plan:</b>
            ${u.plan || "Basic"}
          </p>

          <p>
            <b>Rate:</b>
            ${rate.toFixed(2)}% daily
          </p>

          <p>
            <b>Available Profit:</b>
            <span class="green">
              $${available.toFixed(2)}
            </span>
          </p>

          <p>
            <b>Locked Profit:</b>
            <span class="yellow">
              $${locked.toFixed(2)}
            </span>
          </p>

          <input
            type="number"
            id="bal-${id}"
            placeholder="Add amount"
            min="0"
            step="0.01"
          >

          <button
            class="add"
            onclick="updateBalance('${id}')"
          >
            Add Balance
          </button>

          <button
            class="delete"
            onclick="deleteUser('${id}')"
          >
            Delete
          </button>

        </div>
        `;
      });

      list.innerHTML =
        html ||
        "<p>No users found</p>";

    },
    error=>{
      console.error(
        "Users error:",
        error
      );
    }
  );
}


/* ================================
   UPDATE BALANCE BUTTON
================================ */

const processing = {};

window.updateBalance =
async function(id){

  if(processing[id]){
    return;
  }

  processing[id] = true;

  try{

    const input =
      document.getElementById(
        `bal-${id}`
      );

    const amount =
      Number(input.value);

    if(
      !Number.isFinite(amount) ||
      amount <= 0
    ){
      alert("Enter a valid amount.");
      return;
    }

    await addBalance(
      id,
      amount
    );

    input.value = "";

    alert(
      "Demo balance added successfully."
    );

  }catch(error){

    console.error(error);

    alert(
      "Error: " +
      error.message
    );

  }finally{

    processing[id] = false;
  }
};


/* ================================
   DELETE USER
================================ */

window.deleteUser =
async function(id){

  if(
    !confirm(
      "Delete this user?"
    )
  ){
    return;
  }

  try{

    await deleteDoc(
      doc(db,"users",id)
    );

    alert("User deleted.");

  }catch(error){

    console.error(error);

    alert(
      "Could not delete user."
    );
  }
};


/* ================================
   WITHDRAWALS
================================ */

function loadWithdrawals(){

  const list =
    document.getElementById(
      "withdrawList"
    );

  onSnapshot(
    collection(db,"withdrawals"),
    snapshot=>{

      let html = "";

      snapshot.forEach(docSnap=>{

        const d =
          docSnap.data();

        const id =
          docSnap.id;

        const status =
          d.status || "pending";

        const statusColor =
          status === "approved"
          ? "lightgreen"
          : status === "rejected"
          ? "red"
          : "orange";


        html += `

        <div class="card">

          <p>
            <b>User:</b>
            ${d.userId || "N/A"}
          </p>

          <p>
            <b>Amount:</b>
            $${Number(
              d.amount || 0
            ).toFixed(2)}
          </p>

          <p>
            <b>Coin:</b>
            ${d.coin || "N/A"}
          </p>

          <p>
            <b>Wallet:</b><br>

            <span class="small">
              ${d.wallet || "N/A"}
            </span>
          </p>

          <button
            class="copy"
            onclick="copyWallet('${d.wallet || ""}')"
          >
            Copy Wallet
          </button>

          <p>
            <b>Status:</b>

            <span style="
              color:${statusColor};
            ">
              ${status}
            </span>
          </p>

          ${
            status === "pending"
            ? `

              <button
                class="approve"
                onclick="
                  approveWithdraw(
                    '${id}',
                    '${d.userId}',
                    ${Number(d.amount || 0)}
                  )
                "
              >
                Approve
              </button>

              <button
                class="reject"
                onclick="
                  rejectWithdraw('${id}')
                "
              >
                Reject
              </button>

            `
            : ""
          }

        </div>

        `;
      });

      list.innerHTML =
        html ||
        "<p>No withdrawal requests.</p>";

    }
  );
}


/* ================================
   APPROVE WITHDRAWAL
================================ */

const approving = {};

window.approveWithdraw =
async function(
  id,
  userId,
  amount
){

  if(approving[id]){
    return;
  }

  approving[id] = true;

  try{

    const userRef =
      doc(db,"users",userId);

    const withdrawRef =
      doc(db,"withdrawals",id);


    const userSnap =
      await getDoc(userRef);

    if(!userSnap.exists()){
      throw new Error(
        "User not found."
      );
    }

    const data =
      userSnap.data();


    if(data.admin){
      throw new Error(
        "Admin account cannot withdraw."
      );
    }


    const available =
      Number(
        data.availableProfit || 0
      );


    if(
      amount <= 0 ||
      amount > available
    ){
      throw new Error(
        "Insufficient available demo profit."
      );
    }


    /*
      Deduct only from available profit.
    */

    await updateDoc(
      userRef,
      {
        availableProfit:
          Number(
            (available - amount)
            .toFixed(8)
          )
      }
    );


    /*
      Mark request approved.
    */

    await updateDoc(
      withdrawRef,
      {
        status:"approved",
        processedAt:Date.now()
      }
    );


    /*
      Transaction.
    */

    await addDoc(
      collection(db,"transactions"),
      {
        userId:userId,
        type:"withdraw",
        amount:amount,
        time:Date.now(),
        demo:true
      }
    );


    alert(
      "Demo withdrawal approved."
    );

  }catch(error){

    console.error(error);

    alert(
      error.message
    );

  }finally{

    approving[id] = false;
  }
};


/* ================================
   REJECT
================================ */

window.rejectWithdraw =
async function(id){

  try{

    await updateDoc(
      doc(db,"withdrawals",id),
      {
        status:"rejected",
        processedAt:Date.now()
      }
    );

    alert(
      "Withdrawal rejected."
    );

  }catch(error){

    console.error(error);

    alert(
      "Could not reject withdrawal."
    );
  }
};


/* ================================
   COPY WALLET
================================ */

window.copyWallet =
async function(address){

  try{

    await navigator.clipboard
      .writeText(address);

    alert("Copied!");

  }catch(error){

    alert(
      "Copy failed."
    );
  }
};


/* ================================
   LOGOUT
================================ */

window.logout = async function(){

  await signOut(auth);

  location.href =
    "login.html";
};


/* ================================
   ADMIN AUTH
================================ */

onAuthStateChanged(
  auth,
  async user=>{

    const status =
      document.getElementById(
        "status"
      );

    if(!user){

      status.innerText =
        "Not logged in.";

      return;
    }


    try{

      const ref =
        doc(db,"users",user.uid);

      const snap =
        await getDoc(ref);


      if(!snap.exists()){

        status.innerText =
          "User data not found.";

        return;
      }


      const data =
        snap.data();


      if(!data.admin){

        status.innerText =
          "Access Denied ❌";

        return;
      }


      status.innerText =
        "Welcome Admin ✅";


      loadUsers();

      loadWithdrawals();

    }catch(error){

      console.error(error);

      status.innerText =
        "Admin verification failed.";
    }
  }
);

</script>

</body>
  </html>
