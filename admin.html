<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0f1a;
  color:white;
}

.header{
  padding:15px;
  background:#111827;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container{
  padding:15px;
  max-width:700px;
  margin:auto;
}

.card{
  background:#1f2937;
  padding:15px;
  margin-bottom:12px;
  border-radius:10px;
}

input,select{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border:none;
  border-radius:7px;
  box-sizing:border-box;
}

button{
  padding:9px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-top:5px;
}

.add{
  background:#22c55e;
  color:#000;
}

.delete{
  background:#ef4444;
  color:#fff;
}

.approve{
  background:#22c55e;
  color:#000;
}

.reject{
  background:#ef4444;
  color:#fff;
}

.small{
  color:#9ca3af;
  font-size:13px;
}

.status{
  padding:10px;
  background:#111827;
  border-radius:8px;
  margin-bottom:20px;
}
</style>
</head>

<body>

<div class="header">
  <h2>Admin Dashboard</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

  <div id="status" class="status">
    Checking admin...
  </div>

  <!-- CREATE INVESTMENT -->

  <div class="card">

    <h3>Create Investment</h3>

    <label>User ID</label>

    <input
      id="investmentUser"
      type="text"
      placeholder="Enter user's UID"
    >

    <label>Amount</label>

    <input
      id="investmentAmount"
      type="number"
      min="1"
      step="0.01"
      placeholder="Enter amount"
    >

    <label>Plan</label>

    <select id="investmentPlan">

      <option value="Basic">
        Basic — 2%
      </option>

      <option value="Silver">
        Silver — 2.5%
      </option>

      <option value="Elite">
        Elite — 3%
      </option>

      <option value="Premium">
        Premium — 3.5%
      </option>

      <option value="VIP">
        VIP — 4%
      </option>

    </select>

    <button
      class="add"
      onclick="createInvestment()"
    >
      Create Investment
    </button>

  </div>


  <!-- USERS -->

  <h3>Users</h3>

  <div id="usersList"></div>


  <!-- INVESTMENTS -->

  <h3>Investments</h3>

  <div id="investmentsList"></div>


  <!-- WITHDRAWALS -->

  <h3>Withdraw Requests</h3>

  <div id="withdrawList"></div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  collection,
  onSnapshot,
  addDoc,
  updateDoc,
  deleteDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",

  authDomain:
  "stargicinvestment.firebaseapp.com",

  projectId:
  "stargicinvestment",

  storageBucket:
  "stargicinvestment.appspot.com",

  messagingSenderId:
  "1053305294931",

  appId:
  "1:1053305294931:web:87cba3260a83030e56f6a6"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* =========================
   PLAN CONFIGURATION
========================= */

const PLANS = {

  Basic:{
    rate:0.02,
    min:1,
    max:1999
  },

  Silver:{
    rate:0.025,
    min:2000,
    max:9999
  },

  Elite:{
    rate:0.03,
    min:10000,
    max:49999
  },

  Premium:{
    rate:0.035,
    min:50000,
    max:99999
  },

  VIP:{
    rate:0.04,
    min:100000,
    max:1000000
  }

};


/* =========================
   ADMIN CHECK
========================= */

onAuthStateChanged(
  auth,
  async(user)=>{

    if(!user){

      document.getElementById(
        "status"
      ).innerText =
      "Not logged in";

      return;
    }


    const userRef =
    doc(db,"users",user.uid);


    const snap =
    await getDoc(userRef);


    if(!snap.exists()){

      document.getElementById(
        "status"
      ).innerText =
      "Admin profile not found";

      return;
    }


    const data =
    snap.data();


    if(!data.admin){

      document.getElementById(
        "status"
      ).innerText =
      "Access Denied ❌";

      return;
    }


    document.getElementById(
      "status"
    ).innerText =
    "Welcome Admin ✅";


    loadUsers();

    loadInvestments();

    loadWithdrawals();

  }
);


/* =========================
   CREATE INVESTMENT
========================= */

window.createInvestment =
async function(){

  try{

    const userId =
    document.getElementById(
      "investmentUser"
    ).value.trim();


    const amount =
    Number(
      document.getElementById(
        "investmentAmount"
      ).value
    );


    const plan =
    document.getElementById(
      "investmentPlan"
    ).value;


    if(!userId){

      alert("Enter user ID");

      return;
    }


    if(!Number.isFinite(amount) || amount <= 0){

      alert("Enter a valid amount");

      return;
    }


    const planData =
    PLANS[plan];


    if(
      amount < planData.min ||
      amount > planData.max
    ){

      alert(
        `${plan} accepts $${planData.min} - $${planData.max}`
      );

      return;
    }


    const userRef =
    doc(db,"users",userId);


    const userSnap =
    await getDoc(userRef);


    if(!userSnap.exists()){

      alert("User does not exist");

      return;
    }


    const now =
    Date.now();


    /*
      Each investment gets its
      OWN record and OWN cycle.
    */

    await addDoc(
      collection(db,"investments"),
      {

        userId:userId,

        amount:amount,

        plan:plan,

        rate:planData.rate,

        startTime:now,

        cycleStart:now,

        lockedProfit:0,

        availableProfit:0,

        status:"active",

        createdAt:now

      }
    );


    /*
      Keep the user's displayed
      balance synchronized.

      Capital Locked is also increased
      by the same investment amount.
    */

    const userData =
    userSnap.data();


    await updateDoc(
  userRef,
  {
    balance:
    Number(userData.balance || 0)
    + amount,

    capitalLocked:
    Number(userData.capitalLocked || 0)
    + amount,

    invested:
    Number(userData.invested || 0)
    + amount
  }
);


    /*
      Transaction history.
    */

    await addDoc(
      collection(db,"transactions"),
      {

        userId:userId,

        type:"deposit",

        amount:amount,

        plan:plan,

        time:now

      }
    );


    alert(
      "Investment created successfully"
    );


    document.getElementById(
      "investmentAmount"
    ).value="";


  }catch(error){

    console.error(error);

    alert(
      "Error creating investment: "
      + error.message
    );

  }

};


/* =========================
   LOAD USERS
========================= */

function loadUsers(){

  const list =
  document.getElementById(
    "usersList"
  );


  onSnapshot(
    collection(db,"users"),
    snapshot=>{

      let html="";


      snapshot.forEach(
        docSnap=>{

          const u =
          docSnap.data();

          const id =
          docSnap.id;


          html += `

          <div class="card">

            <b>
              ${u.email || "No email"}
            </b>

            <p class="small">
              UID: ${id}
            </p>

            <p>
              Balance:
              $${Number(
                u.balance || 0
              ).toFixed(2)}
            </p>

            <button
              class="delete"
              onclick="deleteUser('${id}')"
            >
              Delete
            </button>

          </div>

          `;

        }
      );


      list.innerHTML =
      html ||
      "<p>No users found</p>";

    }
  );

}


/* =========================
   LOAD INVESTMENTS
========================= */

function loadInvestments(){

  const list =
  document.getElementById(
    "investmentsList"
  );


  onSnapshot(
    collection(db,"investments"),
    snapshot=>{

      let html="";


      snapshot.forEach(
        docSnap=>{

          const d =
          docSnap.data();


          html += `

          <div class="card">

            <p>
              <b>User:</b>
              ${d.userId}
            </p>

            <p>
              <b>Amount:</b>
              $${Number(
                d.amount || 0
              ).toFixed(2)}
            </p>

            <p>
              <b>Plan:</b>
              ${d.plan}
            </p>

            <p>
              <b>Rate:</b>
              ${(Number(
                d.rate || 0
              ) * 100).toFixed(2)}%
            </p>

            <p>
              <b>Status:</b>
              ${d.status}
            </p>

            <p>
              <b>Locked Profit:</b>
              $${Number(
                d.lockedProfit || 0
              ).toFixed(2)}
            </p>

            <p>
              <b>Available Profit:</b>
              $${Number(
                d.availableProfit || 0
              ).toFixed(2)}
            </p>

            <p class="small">
              Started:
              ${new Date(
                d.startTime
              ).toLocaleString()}
            </p>

          </div>

          `;

        }
      );


      list.innerHTML =
      html ||
      "<p>No investments yet</p>";

    }
  );

}


/* =========================
   LOAD WITHDRAWALS
========================= */

function loadWithdrawals(){

  const list =
  document.getElementById(
    "withdrawList"
  );


  onSnapshot(
    collection(db,"withdrawals"),
    snapshot=>{

      let html="";


      snapshot.forEach(
        docSnap=>{

          const d =
          docSnap.data();

          const id =
          docSnap.id;


          html += `

          <div class="card">

            <p>
              <b>User:</b>
              ${d.userId}
            </p>

            <p>
              <b>Amount:</b>
              $${Number(
                d.amount || 0
              ).toFixed(2)}
            </p>

            <p>
              <b>Coin:</b>
              ${d.coin || "N/A"}
            </p>

            <p>
              <b>Status:</b>
              ${d.status || "pending"}
            </p>

            ${
              d.status === "pending"
              ?

              `
              <button
                class="approve"
                onclick="approveWithdraw('${id}')"
              >
                Approve
              </button>

              <button
                class="reject"
                onclick="rejectWithdraw('${id}')"
              >
                Reject
              </button>
              `

              :

              ""
            }

          </div>

          `;

        }
      );


      list.innerHTML =
      html ||
      "<p>No withdrawal requests</p>";

    }
  );

}


/* =========================
   DELETE USER
========================= */

window.deleteUser =
async function(id){

  if(
    !confirm(
      "Delete this user?"
    )
  ){

    return;
  }


  await deleteDoc(
    doc(db,"users",id)
  );


  alert("User deleted");

};


/* =========================
   WITHDRAW ACTIONS
========================= */

window.approveWithdraw =
async function(id){

  await updateDoc(
    doc(
      db,
      "withdrawals",
      id
    ),
    {
      status:"approved",
      processedAt:Date.now()
    }
  );


  alert(
    "Withdrawal approved"
  );

};


window.rejectWithdraw =
async function(id){

  await updateDoc(
    doc(
      db,
      "withdrawals",
      id
    ),
    {
      status:"rejected",
      processedAt:Date.now()
    }
  );


  alert(
    "Withdrawal rejected"
  );

};


/* =========================
   LOGOUT
========================= */

window.logout =
function(){

  signOut(auth);

  location.href =
  "login.html";

};

</script>

</body>
</html>
