<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial;
  background:#0b0f1a;
  color:#fff;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  padding:15px 20px;
  background:#111827;
  align-items:center;
}

.header h2{
  color:#00ff9d;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

/* CARD */
.card{
  background:#111827;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,0.5);
}

/* TABLE */
.table{
  width:100%;
  border-collapse:collapse;
}

.table th, .table td{
  padding:10px;
  border-bottom:1px solid #333;
  text-align:left;
}

button{
  padding:6px 10px;
  border:none;
  cursor:pointer;
  border-radius:6px;
}

.approve{
  background:#00ff9d;
  color:#000;
}

.reject{
  background:#ff4d4d;
  color:#fff;
}

/* SCROLL */
.section{
  padding:20px;
  overflow-x:auto;
}
</style>
</head>

<body>

<div class="header">
  <h2>Admin Panel</h2>
  <button onclick="logout()">Logout</button>
</div>

<!-- STATS -->
<div class="grid">

  <div class="card">
    <h3>Total Users</h3>
    <p id="totalUsers">0</p>
  </div>

  <div class="card">
    <h3>Pending Withdrawals</h3>
    <p id="pending">0</p>
  </div>

</div>

<!-- USERS -->
<div class="section">
  <h2>Users</h2>
  <table class="table">
    <thead>
      <tr>
        <th>Email</th>
        <th>Balance</th>
        <th>Profit</th>
        <th>Invested</th>
      </tr>
    </thead>
    <tbody id="usersTable"></tbody>
  </table>
</div>

<!-- WITHDRAWS -->
<div class="section">
  <h2>Withdraw Requests</h2>
  <table class="table">
    <thead>
      <tr>
        <th>Email</th>
        <th>Amount</th>
        <th>Type</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="withdrawTable"></tbody>
  </table>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, onSnapshot,
  doc, updateDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// 🔐 AUTH CHECK (ADMIN ONLY)
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    alert("Not logged in");
    location.href = "login.html";
    return;
  }

  console.log("User email:", user.email);
  console.log("User UID:", user.uid);

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    alert("User doc not found");
    return;
  }

  const data = snap.data();
  console.log("User data:", data);

  if(!data.isAdmin){
    alert("You are NOT admin");
    return;
  }

  alert("Admin access granted");
});

// 🚪 LOGOUT
window.logout = function(){
  signOut(auth);
};

// ==========================
// 📊 USERS DATA
// ==========================
const usersTable = document.getElementById("usersTable");

onSnapshot(collection(db,"users"),(snapshot)=>{

  usersTable.innerHTML = "";
  document.getElementById("totalUsers").innerText = snapshot.size;

  snapshot.forEach(docSnap=>{
    const d = docSnap.data();

    usersTable.innerHTML += `
      <tr>
        <td>${d.email || "N/A"}</td>
        <td>${d.balance || 0}</td>
        <td>${d.profit || 0}</td>
        <td>${d.invested || 0}</td>
      </tr>
    `;
  });

});

// ==========================
// 💰 WITHDRAW REQUESTS
// ==========================
const withdrawTable = document.getElementById("withdrawTable");

onSnapshot(collection(db,"withdraws"),(snapshot)=>{

  withdrawTable.innerHTML = "";
  let pendingCount = 0;

  snapshot.forEach(docSnap=>{
    const d = docSnap.data();

    if(d.status === "pending") pendingCount++;

    withdrawTable.innerHTML += `
      <tr>
        <td>${d.email}</td>
        <td>${d.amount}</td>
        <td>${d.type}</td>
        <td>${d.status}</td>
        <td>
          ${d.status === "pending" ? `
          <button class="approve" onclick="approve('${docSnap.id}','${d.userId}','${d.type}',${d.amount})">Approve</button>
          <button class="reject" onclick="reject('${docSnap.id}')">Reject</button>
          ` : "Done"}
        </td>
      </tr>
    `;
  });

  document.getElementById("pending").innerText = pendingCount;

});

// ==========================
// ✅ APPROVE
// ==========================
window.approve = async function(id,userId,type,amount){

  const userRef = doc(db,"users",userId);
  const snap = await getDoc(userRef);
  const data = snap.data();

  if(type === "profit"){
    await updateDoc(userRef,{
      profit: Math.max(0, (data.profit || 0) - amount)
    });
  }

  if(type === "capital"){
    await updateDoc(userRef,{
      balance: 0,
      invested: 0,
      profit: 0,
      depositStart: Date.now(),
      profitStart: Date.now()
    });
  }

  await updateDoc(doc(db,"withdraws",id),{
    status: "approved"
  });

  alert("Approved");
};

// ==========================
// ❌ REJECT
// ==========================
window.reject = async function(id){
  await updateDoc(doc(db,"withdraws",id),{
    status: "rejected"
  });
};

</script>

</body>
</html>
