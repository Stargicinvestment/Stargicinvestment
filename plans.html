<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit | StargicInvestment</title>

<style>

/* GLOBAL */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:linear-gradient(135deg,#06141f,#0b1f2e,#0f2e3f);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:15px;
}

/* CARD */
.card{
  width:100%;
  max-width:430px;
  padding:25px;
  border-radius:18px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(0,255,166,0.15);
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

/* TITLE */
.title{
  font-size:24px;
  font-weight:700;
  color:#00ffa6;
  text-align:center;
}

.sub{
  text-align:center;
  font-size:13px;
  color:#9be7c4;
  margin:10px 0 20px;
}

/* PLAN BOX */
.plan-box{
  background:rgba(0,0,0,0.35);
  border-radius:12px;
  padding:15px;
  margin-bottom:20px;
  border:1px solid rgba(0,255,166,0.1);
}

.plan-box p{
  font-size:13px;
  margin:6px 0;
}

.plan-box strong{
  color:#00ffa6;
}

/* WALLET CARD */
.wallet-card{
  background:rgba(0,0,0,0.5);
  border:1px solid rgba(0,255,166,0.15);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}

/* COIN NAME */
.coin{
  font-size:14px;
  font-weight:600;
  color:#00ffa6;
  margin-bottom:6px;
}

/* ADDRESS */
.address{
  font-size:12px;
  word-break:break-all;
  color:#d4fff0;
  margin-bottom:8px;
}

/* COPY BUTTON */
.copy-btn{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:linear-gradient(45deg,#00ffa6,#00c853);
  color:#002b1f;
  font-weight:600;
  cursor:pointer;
}

/* SUCCESS STATE */
.copied{
  background:#00c853 !important;
  color:#fff !important;
}

/* CONFIRM BUTTON */
.confirm-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  background:rgba(255,255,255,0.08);
  color:#00ffa6;
  font-weight:600;
  cursor:pointer;
  border:1px solid rgba(0,255,166,0.2);
}

.confirm-btn:hover{
  background:rgba(0,255,166,0.1);
}

</style>
</head>

<body>

<div class="card">

  <div class="title">Secure Deposit</div>
  <div class="sub">Send crypto using any wallet below</div>

  <!-- PLAN INFO -->
  <div class="plan-box" id="planInfo"></div>

  <!-- BTC -->
  <div class="wallet-card">
    <div class="coin">BTC (Bitcoin)</div>
    <div class="address" id="btc">bc1q8g7945qssttzquls977ray4flrn4qzn68h5xnv</div>
    <button class="copy-btn" onclick="copyWallet('btc',this)">Copy BTC Address</button>
  </div>

  <!-- ETH -->
  <div class="wallet-card">
    <div class="coin">ETH (BEP20)</div>
    <div class="address" id="eth">0xf6bc9eb4370868abc37526e74ca471be4644fbb7</div>
    <button class="copy-btn" onclick="copyWallet('eth',this)">Copy ETH Address</button>
  </div>

  <!-- USDT -->
  <div class="wallet-card">
    <div class="coin">USDT (BEP20)</div>
    <div class="address" id="usdt">0xf6bc9eb4370868abc37526e74ca471be4644fbb7</div>
    <button class="copy-btn" onclick="copyWallet('usdt',this)">Copy USDT Address</button>
  </div>

  <button class="confirm-btn" onclick="confirmPayment()">
    I Have Sent Payment
  </button>

</div>

<script>

// LOAD PLAN
const plan = JSON.parse(localStorage.getItem("selectedPlan"));

if(plan){
  document.getElementById("planInfo").innerHTML = `
    <p><strong>Plan:</strong> ${plan.name.toUpperCase()}</p>
    <p><strong>Min:</strong> $${plan.min}</p>
    <p><strong>Max:</strong> $${plan.max}</p>
    <p><strong>Profit:</strong> ${plan.percent}% daily</p>
  `;
}else{
  document.getElementById("planInfo").innerHTML = `
    <p style="color:red;">No plan selected</p>
  `;
}

// COPY FUNCTION
function copyWallet(id,btn){
  const text = document.getElementById(id).innerText;

  navigator.clipboard.writeText(text);

  btn.innerText = "Copied ✓";
  btn.classList.add("copied");

  setTimeout(()=>{
    btn.innerText = "Copy Address";
    btn.classList.remove("copied");
  },2000);
}

// CONFIRM
function confirmPayment(){
  alert("Payment submitted! Admin will verify shortly.");
}

</script>

</body>
  </html>
