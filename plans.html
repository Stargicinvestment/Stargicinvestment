<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Deposit</title>

<style>
body{
  margin:0;
  font-family:Poppins, sans-serif;

  /* 🔥 PREMIUM GREEN BACKGROUND */
  background: radial-gradient(circle at top, #0f3d2e, #050505 70%);
  color:#fff;
}

/* CENTER EVERYTHING */
.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

/* CARD */
.deposit-box{
  width:100%;
  max-width:400px;

  background:rgba(255,255,255,0.03);
  border-radius:20px;
  padding:25px;
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.05);

  box-shadow:0 20px 60px rgba(0,0,0,0.8);
}

/* TITLE */
.deposit-box h2{
  font-weight:500;
  margin-bottom:10px;
}

.deposit-box p{
  color:#aaa;
  margin-bottom:25px;
}

/* LABEL */
label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
}

select, input{
  width:100%;
  padding:16px;
  border-radius:10px;
  border:none;
  background:#1a1f2e;
  color:#fff;
  margin-bottom:20px;
  font-size:15px;

  box-sizing: border-box; /* 🔥 ensures it stays inside */
}
/* BUTTON */
button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:500;
  cursor:pointer;

  background:linear-gradient(135deg,#00ffae,#00c3ff);
  color:#000;

  transition:0.3s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(0,255,174,0.3);
}

/* ERROR */
.error{
  color:#ff4d4d;
  font-size:13px;
  margin-top:-15px;
  margin-bottom:10px;
}

/* SUCCESS */
.success{
  text-align:center;
  color:#00ffae;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="deposit-box">

    <h2>Make Deposit</h2>
    <p>Minimum Deposit: $300</p>

    <form id="depositForm">

      <label>Currency *</label>
      <select id="currency">
        <option value="">Choose Currency</option>
        <option>Bitcoin (BTC)</option>
        <option>Ethereum (ETH)</option>
        <option>USDT</option>
      </select>

      <label>Enter Amount *</label>
      <input type="number" id="amount" placeholder="0000.00">

      <div id="error" class="error"></div>

      <button type="submit">Make Deposit</button>

    </form>

    <div id="success" class="success"></div>

  </div>

</div>

<script>
document.getElementById("depositForm").addEventListener("submit", function(e){
  e.preventDefault();

  const currency = document.getElementById("currency").value;
  const amount = document.getElementById("amount").value;

  if(!currency){
    alert("Select currency");
    return;
  }

  if(!amount || amount < 300){
    alert("Minimum deposit is $300");
    return;
  }

  // 🔥 PASS DATA TO NEXT PAGE
  window.location.href = `payment.html?amount=${amount}&coin=${currency}`;
});
</script>

</body>
</html>
