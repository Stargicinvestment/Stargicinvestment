<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

body{
  background:#0b0f1a;
  color:#fff;
  padding:18px;
}

.container{max-width:430px;margin:auto}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #2d2cff;
}

.menu{font-size:26px}

/* BALANCE */
.balance{
  font-size:36px;
  font-weight:700;
  color:#00ff9d;
  margin-top:6px;
}

/* CARD */
.card{
  background:#111827;
  padding:14px;
  border-radius:14px;
  margin-top:14px;
}

/* PROFIT */
.profit{
  color:gold;
  font-size:20px;
  font-weight:700;
}

/* BUTTONS */
.actions{display:flex;gap:10px}

button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

.deposit{background:#2d2cff;color:#fff}
.withdraw{background:#ff2d55;color:#fff}

/* TX */
.tx{
  background:#0b1030;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
  font-size:13px;
}

/* SMALL */
.small{font-size:12px;color:#aaa}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="brand" onclick="openUpload()">
      <img id="avatar" class="avatar" src="https://i.imgur.com/6VBx3io.png">
      <div>
        <b>Dashboard</b>
        <div class="small">Tap photo</div>
      </div>
    </div>

    <div class="menu">☰</div>
  </div>

  <!-- BALANCE -->
  <div>Balance</div>
  <div id="balance" class="balance">$0.00</div>

  <!-- PROFIT -->
  <div id="profitCard" class="card" style="display:none">
    <div>Profit</div>
    <div id="profit" class="profit">$0.00</div>
    <div id="locked" class="small"></div>
  </div>

  <!-- ACTIONS -->
  <div class="card actions">
    <button class="deposit" onclick="goDeposit()">Deposit</button>
    <button class="withdraw" onclick="goWithdraw()">Withdraw</button>
  </div>

  <!-- REF -->
  <div class="card">
    <div>Referral Link</div>
    <input id="ref" style="width:100%;padding:10px;border-radius:8px;border:none;margin-top:8px;" readonly>
    <button onclick="copyRef()" style="margin-top:10px;width:100%;background:#2d2cff;color:#fff;padding:10px;border:none;border-radius:8px;">
      Copy Referral
    </button>
  </div>

  <!-- TX -->
  <div class="card">
    <h3>Transactions</h3>
    <div id="history"></div>
  </div>

  <!-- WITHDRAW -->
  <div class="card">
    <h3>Withdrawals</h3>
    <div id="withdrawals"></div>
  </div>

</div>

<input type="file" id="file" hidden>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, updateDoc, getDoc, collection, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* 🔥 YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* ELEMENTS */
const balanceEl = document.getElementById("balance");
const profitCard = document.getElementById("profitCard");
const profitEl = document.getElementById("profit");
const lockedEl = document.getElementById("locked");
const avatar = document.getElementById("avatar");
const fileInput = document.getElementById("file");
const refInput = document.getElementById("ref");
const historyEl = document.getElementById("history");
const withdrawEl = document.getElementById("withdrawals");

let userRef;
let currentUser;

/* 🔥 MINING ENGINE */
async function mine() {
  if (!userRef) return;

  const snap = await getDoc(userRef);
  if (!snap.exists()) return;

  const d = snap.data();

  const balance = Number(d.balance || 0);
  if (balance <= 0) return;

  const now = Date.now();
  const last = d.lastUpdate || now;

  const hours = (now - last) / 3600000;
  if (hours < 1) return;

  const rate = 0.02; // 2% daily
  const earned = balance * rate * (hours / 24);

  if (earned <= 0) return;

  await updateDoc(userRef, {
    availableProfit: (d.availableProfit || 0) + earned,
    lockedProfit: (d.lockedProfit || 0) + earned,
    lastUpdate: now
  });
}

/* AUTH */
onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = "login.html";

  currentUser = user;
  userRef = doc(db, "users", user.uid);

  /* referral */
  refInput.value = `https://yourdomain.com/register?ref=${user.uid}`;

  /* run mining */
  mine();
  setInterval(mine, 60000);

  /* user data */
  onSnapshot(userRef, (snap) => {
    const d = snap.data();
    if (!d) return;

    balanceEl.innerText = "$" + (d.balance || 0).toFixed(2);

    if (d.balance > 0 || d.availableProfit > 0) {
      profitCard.style.display = "block";
      profitEl.innerText = "$" + (d.availableProfit || 0).toFixed(2);
      lockedEl.innerText = "Locked: $" + (d.lockedProfit || 0).toFixed(2);
    } else {
      profitCard.style.display = "none";
    }

    if (d.photoURL) avatar.src = d.photoURL + "?t=" + Date.now();
  });

  /* transactions */
  onSnapshot(query(collection(db, "transactions"), where("userId", "==", user.uid)), (snap) => {
    historyEl.innerHTML = "";
    snap.forEach(doc => {
      const d = doc.data();
      historyEl.innerHTML += `
        <div class="tx">
          <b>${d.type}</b> - $${d.amount}
          <div class="small">${new Date(d.time).toLocaleString()}</div>
        </div>`;
    });
  });

  /* withdrawals */
  onSnapshot(query(collection(db, "withdrawals"), where("userId", "==", user.uid)), (snap) => {
    withdrawEl.innerHTML = "";
    snap.forEach(doc => {
      const d = doc.data();
      withdrawEl.innerHTML += `
        <div class="tx">
          <b>${d.status}</b> - $${d.amount}
        </div>`;
    });
  });
});

/* PROFILE UPLOAD */
window.openUpload = () => fileInput.click();

fileInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file || !currentUser) return;

  const imgRef = ref(storage, `avatars/${currentUser.uid}`);
  await uploadBytes(imgRef, file);

  const url = await getDownloadURL(imgRef);

  await updateDoc(userRef, {
    photoURL: url
  });

  avatar.src = url;
};

/* COPY */
window.copyRef = () => {
  navigator.clipboard.writeText(refInput.value);
  alert("Copied");
};

/* NAV */
window.goDeposit = () => location.href = "deposit.html";
window.goWithdraw = () => location.href = "withdraw.html";

</script>

</body>
  </html>
