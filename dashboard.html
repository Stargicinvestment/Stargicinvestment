/* =====================================
   NUMBER HELPER
===================================== */

function num(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


/* =====================================
   MINING ENGINE

   IMPORTANT:

   The browser timer is only used to
   refresh the calculation.

   The actual mining time comes from
   cycleStart stored in Firestore.

   Therefore closing the browser does
   NOT reset the mining timer.
===================================== */

async function runMining(userRef){

  try{

    const snapshot =
      await getDoc(userRef);


    if(!snapshot.exists()){

      return;

    }


    const data =
      snapshot.data();


    const invested =
      num(
        data.invested
      );


    const rate =
      num(
        data.rate
      );


    /*
      No mining capital.
    */

    if(
      invested <= 0 ||
      rate <= 0
    ){

      return;

    }


    const now =
      Date.now();


    let cycleStart =
      num(
        data.cycleStart ||
        data.profitStart ||
        data.startTime
      );


    let availableProfit =
      num(
        data.availableProfit
      );


    /*
      ---------------------------------
      FIRST START
      ---------------------------------
    */

    if(!cycleStart){

      await updateDoc(
        userRef,
        {

          cycleStart:
            now,

          profitStart:
            now,

          lastUpdate:
            now,

          availableProfit:
            Number(
              availableProfit.toFixed(8)
            ),

          lockedProfit:
            0

        }
      );


      return;

    }


    /*
      Prevent a bad future timestamp
      from breaking the simulation.
    */

    if(
      cycleStart > now
    ){

      cycleStart =
        now;

    }


    /*
      ---------------------------------
      ELAPSED TIME
      ---------------------------------
    */

    const elapsed =
      now -
      cycleStart;


    /*
      ---------------------------------
      COMPLETED 7-DAY CYCLES
      ---------------------------------
    */

    const completedCycles =
      Math.floor(
        elapsed /
        CYCLE
      );


    /*
      Profit generated during
      ONE complete 7-day cycle.

      Example:

      $1,000 × 2% × 7
      = $140
    */

    if(
      completedCycles > 0
    ){

      const cycleProfit =
        invested *
        rate *
        7;


      const releasedProfit =
        cycleProfit *
        completedCycles;


      availableProfit +=
        releasedProfit;


      /*
        Move timestamp forward by
        exactly the completed cycles.
      */

      cycleStart +=
        completedCycles *
        CYCLE;

    }


    /*
      ---------------------------------
      CURRENT LOCKED PROFIT
      ---------------------------------
    */

    const currentElapsed =
      Math.max(
        0,
        now -
        cycleStart
      );


    const currentDays =
      currentElapsed /
      DAY;


    let lockedProfit =
      invested *
      rate *
      currentDays;


    /*
      Don't allow floating-point
      overflow beyond the cycle.
    */

    const maxCycleProfit =
      invested *
      rate *
      7;


    if(
      lockedProfit >
      maxCycleProfit
    ){

      lockedProfit =
        maxCycleProfit;

    }


    /*
      ---------------------------------
      SAVE
      ---------------------------------
    */

    await updateDoc(
      userRef,
      {

        availableProfit:
          Number(
            availableProfit.toFixed(8)
          ),

        lockedProfit:
          Number(
            lockedProfit.toFixed(8)
          ),

        cycleStart:
          cycleStart,

        lastUpdate:
          now

      }
    );


  }catch(error){

    console.error(
      "Mining error:",
      error
    );

  }

}


/* =====================================
   START MINING
===================================== */

function startMining(user){

  const userRef =
    doc(
      db,
      "users",
      user.uid
    );


  /*
    Run immediately.
  */

  runMining(
    userRef
  );


  /*
    Refresh every minute.

    This does NOT mean the user earns
    every minute.

    The timestamp calculation decides
    the actual amount.
  */

  if(miningTimer){

    clearInterval(
      miningTimer
    );

  }


  miningTimer =
    setInterval(
      () => {

        runMining(
          userRef
        );

      },
      60000
    );

}


/* =====================================
   DISPLAY MINING
===================================== */

function displayMining(data){

  const invested =
    num(
      data.invested
    );

  const rate =
    num(
      data.rate
    );

  const availableProfit =
    num(
      data.availableProfit
    );

  const lockedProfit =
    num(
      data.lockedProfit
    );


  /*
    No active mining.
  */

  if(
    invested <= 0 ||
    rate <= 0
  ){

    miningBox.style.display =
      "none";

    return;

  }


  miningBox.style.display =
    "block";


  /*
    Plan
  */

  let plan =
    data.plan ||
    "Custom";


  planNameEl.innerText =
    plan;


  /*
    Status
  */

  miningStatusEl.innerText =
    "MINING";

  miningStatusEl.style.background =
    "#123d2d";

  miningStatusEl.style.color =
    "#00ff9d";


  /*
    Capital
  */

  investedEl.innerText =
    "$" +
    invested.toFixed(2);


  /*
    Available profit
  */

  profitEl.innerText =
    "$" +
    availableProfit.toFixed(2);


  /*
    Locked profit
  */

  lockedEl.innerText =
    "Locked Profit: $" +
    lockedProfit.toFixed(2);


  /*
    Cycle progress
  */

  const cycleStart =
    num(
      data.cycleStart ||
      data.profitStart ||
      data.startTime
    );


  if(cycleStart){

    const now =
      Date.now();


    const elapsed =
      Math.max(
        0,
        now -
        cycleStart
      );


    const progress =
      Math.min(
        100,
        (
          elapsed /
          CYCLE
        ) *
        100
      );


    progressBar.style.width =
      progress +
      "%";


    const remaining =
      Math.max(
        0,
        CYCLE -
        elapsed
      );


    const days =
      Math.floor(
        remaining /
        DAY
      );


    const hours =
      Math.floor(
        (
          remaining %
          DAY
        ) /
        (60 * 60 * 1000)
      );


    const minutes =
      Math.floor(
        (
          remaining %
          (60 * 60 * 1000)
        ) /
        (60 * 1000)
      );


    if(
      remaining <= 0
    ){

      nextCycleEl.innerText =
        "Cycle completing...";

    }else{

      nextCycleEl.innerText =
        "Next profit release in " +
        days +
        "d " +
        hours +
        "h " +
        minutes +
        "m";

    }

  }

}


/* =====================================
   AUTH
===================================== */

onAuthStateChanged(
  auth,
  async(user) => {

    if(!user){

      location.href =
        "login.html";

      return;

    }


    currentUser =
      user;


    /*
      Start mining engine.
    */

    startMining(
      user
    );


    const userRef =
      doc(
        db,
        "users",
        user.uid
      );


    /*
      REFERRAL
    */

    refInput.value =
      "https://stargicinvestment.github.io/Stargicinvestment";


    /*
      USER DATA
    */

    onSnapshot(
      userRef,
      (snapshot) => {

        if(!snapshot.exists()){

          return;

        }


        const data =
          snapshot.data();


        /*
          Welcome
        */

        document.getElementById(
          "welcomeText"
        ).innerText =
          "Welcome, " +
          (
            data.fullName ||
            data.name ||
            "User"
          );


        /*
          Balance
        */

        const balance =
          num(
            data.balance
          );


        balanceEl.innerText =
          "$" +
          balance.toFixed(2);


        /*
          Mining
        */

        displayMining(
          data
        );


        /*
          Profile photo
        */

        if(
          data.photoURL
        ){

          avatar.src =
            data.photoURL +
            "?t=" +
            Date.now();

        }

      }
    );


    /* =================================
       TRANSACTIONS
    ================================= */

    const txQuery =
      query(
        collection(
          db,
          "transactions"
        ),
        where(
          "userId",
          "==",
          user.uid
        )
      );


    onSnapshot(
      txQuery,
      (snapshot) => {

        historyEl.innerHTML =
          "";


        if(snapshot.empty){

          historyEl.innerHTML = `
            <div class="tx">
              No transactions yet
            </div>
          `;

          return;

        }


        snapshot.forEach(
          (item) => {

            const data =
              item.data();


            const amount =
              num(
                data.amount
              );


            const type =
              (
                data.type ||
                "transaction"
              ).toUpperCase();


            const color =
              data.type === "deposit"
                ? "lightgreen"
                : "#ff6b6b";


            let time =
              "";


            if(data.time){

              time =
                new Date(
                  data.time
                ).toLocaleString();

            }


            historyEl.innerHTML += `

              <div class="tx">

                <div class="tx-top">

                  <b style="color:${color}">
                    ${type}
                  </b>

                  <span>
                    $${amount.toFixed(2)}
                  </span>

                </div>

                <div class="small">
                  ${time}
                </div>

              </div>

            `;

          }
        );

      }
    );


    /* =================================
       WITHDRAWALS
    ================================= */

    const withdrawalQuery =
      query(
        collection(
          db,
          "withdrawals"
        ),
        where(
          "userId",
          "==",
          user.uid
        )
      );


    onSnapshot(
      withdrawalQuery,
      (snapshot) => {

        withdrawEl.innerHTML =
          "";


        if(snapshot.empty){

          withdrawEl.innerHTML = `
            <div class="tx">
              No withdraw requests
            </div>
          `;

          return;

        }


        snapshot.forEach(
          (item) => {

            const data =
              item.data();


            const amount =
              num(
                data.amount
              );


            const status =
              (
                data.status ||
                "pending"
              ).toUpperCase();


            let color =
              "orange";


            if(
              data.status ===
              "approved"
            ){

              color =
                "lightgreen";

            }


            if(
              data.status ===
              "rejected"
            ){

              color =
                "#ff6b6b";

            }


            let time =
              "";


            if(data.time){

              time =
                new Date(
                  data.time
                ).toLocaleString();

            }


            withdrawEl.innerHTML += `

              <div class="tx">

                <div class="tx-top">

                  <b style="color:${color}">
                    ${status}
                  </b>

                  <span>
                    $${amount.toFixed(2)}
                  </span>

                </div>

                <div class="small">
                  ${data.coin || ""}
                </div>

                <div class="small">
                  ${time}
                </div>

              </div>

            `;

          }
        );

      }
    );

  }
);


/* =====================================

===================================== */

window.openUpload =
  () => {

    fileInput.click();

fileInput.onchange =
  async(event) => {

    try{

      const file =
        event.target.files[0];


      if(
        !file ||
        !currentUser
      ){

        return;

      }


      const imageRef =
        ref(
          storage,
          `avatars/${currentUser.uid}`
        );


      await uploadBytes(
        imageRef,
        file
      );


      const url =
        await getDownloadURL(
          imageRef
        );


      await updateDoc(
        doc(
          db,
          "users",
          currentUser.uid
        ),
        {
          photoURL:url
        }
      );


      avatar.src =
        url;


    }catch(error){

      console.error(
        error
      );

      alert(
        "Could not upload photo."
      );

    }

  };

/* =====================================
   COPY REFERRAL
===================================== */

window.copyRef =
  async() => {

    const text =
      refInput.value;


    try{

      await navigator.clipboard
        .writeText(text);

      alert(
        "Copied successfully"
      );

    }catch(error){

      const input =
        document.createElement(
          "input"
        );


      input.value =
        text;


      document.body.appendChild(
        input
      );


      input.select();

      document.execCommand(
        "copy"
      );


      document.body.removeChild(
        input
      );


      alert(
        "Copied successfully"
      );

    }

  };

    );
