<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#02011a;
  color:white;
  font-size:14px;
}

.container{
  max-width:480px;
  margin:auto;
  padding:14px;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.logo{width:70px;}
.menu{font-size:28px;cursor:pointer;}

/* BALANCE */
.balance,.profit{
  font-size:20px;
  font-weight:700;
  margin-bottom:6px;
}

/* CARD */
.card{
  background:#111827;
  padding:16px;
  border-radius:14px;
  margin-top:15px;
}

/* REFERRAL */
.ref-box{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:10px;
}

.ref-box input{
  padding:12px;
  border:none;
  border-radius:8px;
}

.ref-box button{
  padding:12px;
  border:none;
  border-radius:8px;
  background:#2d2cff;
  color:white;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.actions button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  color:white;
}

.deposit{background:#2d2cff;}
.withdraw{background:#ff2d55;}

/* CRYPTO */
.coin{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.coin img{
  width:28px;
}

/* TX */
.tx{
  background:#0b1030;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

.tx-top{
  display:flex;
  justify-content:space-between;
}

.gray{color:#aaa;font-size:12px;}

.green{color:#00ff88;}
.red{color:#ff4d4d;}
.orange{color:orange;}

</style>
</head>

<body>

<div class="container">

<div class="topbar">
  <img src="https://i.imgur.com/6VBx3io.png" class="logo">
  <div class="menu">☰</div>
</div>

<h2>Account Balance</h2>
<div id="balance" class="balance">$0.00</div>
<div id="profit" class="profit">$0.00</div>

<!-- ✅ REFERRAL RESTORED -->
<div class="card">
  <h3>Referral Commissions</h3>
  <p>Invite friends and earn commission easily.</p>

  <div class="ref-box">
    <input id="refLink" value="stargicinvestment.com" readonly>
    <button onclick="copyRef()">Copy Link</button>
  </div>
</div>

<!-- ACTIONS -->
<div class="card actions">
  <button class="deposit" onclick="goDeposit()">Deposit</button>
  <button class="withdraw" onclick="goWithdraw()">Withdraw</button>
</div>

<!-- CRYPTO -->
<div class="card">

  <div class="coin">
    <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png">
    <h3 id="btcPrice">$0</h3>
  </div>

  <div class="coin">
    <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png">
    <h3 id="ethPrice">$0</h3>
  </div>

  <div class="coin">
    <img src="https://cryptologos.cc/logos/tether-usdt-logo.png">
    <h3 id="usdtPrice">$0</h3>
  </div>

  <div class="coin">
    <img src="https://cryptologos.cc/logos/xrp-xrp-logo.png">
    <h3 id="xrpPrice">$0</h3>
  </div>

</div>

<!-- TRANSACTIONS -->
<div class="card">
  <h3>Transactions</h3>
  <div id="history"></div>
</div>

<!-- WITHDRAW -->
<div class="card">
  <h3>Withdraw Requests</h3>
  <div id="withdrawHistory"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain:"stargicinvestment.firebaseapp.com",
  projectId:"stargicinvestment"
});

const auth = getAuth(app);
const db = getFirestore(app);

/* PRICES */
async function loadPrices(){
  const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether,ripple&vs_currencies=usd");
  const d = await r.json();

  btcPrice.innerText = "$"+d.bitcoin.usd;
  ethPrice.innerText = "$"+d.ethereum.usd;
  usdtPrice.innerText = "$"+d.tether.usd;
  xrpPrice.innerText = "$"+d.ripple.usd;
}
loadPrices();

/* MINING FIXED */
const plans = {
  Basic:{rate:0.02},
  Silver:{rate:0.025},
  Elite:{rate:0.03},
  Premium:{rate:0.035},
  VIP:{rate:0.04}
};

async function mine(ref){
  const snap = await getDoc(ref);
  if(!snap.exists()) return;

  const d = snap.data();

  let invested = Number(d.invested)||0;
  if(!invested || !d.plan) return;

  const plan = plans[d.plan];
  if(!plan) return;

  let now = Date.now();
  let last = Number(d.lastUpdate)||now;

  let earned = invested * plan.rate * ((now-last)/(1000*60*60*24));

  if(earned <= 0) return;

  await updateDoc(ref,{
    lockedProfit:(Number(d.lockedProfit)||0)+earned,
    lastUpdate:now
  });
}

function startMining(user){
  const ref = doc(db,"users",user.uid);
  mine(ref);
  setInterval(()=>mine(ref),60000);
}

/* AUTH */
onAuthStateChanged(auth,(user)=>{
  if(!user) location.href="login.html";

  const ref = doc(db,"users",user.uid);
  startMining(user);

  onSnapshot(ref,s=>{
    const d = s.data();
    balance.innerText="$"+(d.balance||0).toFixed(2);
    profit.innerText="$"+(d.availableProfit||0).toFixed(2);
  });

  /* TX */
  onSnapshot(query(collection(db,"transactions"),where("userId","==",user.uid)),s=>{
    history.innerHTML="";
    s.forEach(i=>{
      const d=i.data();
      const color=d.type==="deposit"?"green":"red";

      history.innerHTML+=`
      <div class="tx">
        <div class="tx-top">
          <b class="${color}">${d.type}</b>
          <span>$${d.amount}</span>
        </div>
        <div class="gray">${new Date(d.time).toLocaleString()}</div>
      </div>`;
    });
  });

  /* WITHDRAW */
  onSnapshot(query(collection(db,"withdrawals"),where("userId","==",user.uid)),s=>{
    withdrawHistory.innerHTML="";
    s.forEach(i=>{
      const d=i.data();
      const color=d.status==="approved"?"green":d.status==="rejected"?"red":"orange";

      withdrawHistory.innerHTML+=`
      <div class="tx">
        <div class="tx-top">
          <b class="${color}">${d.status}</b>
          <span>$${d.amount}</span>
        </div>
        <div class="gray">${d.coin}</div>
      </div>`;
    });
  });
});

/* ACTIONS */
window.goDeposit=()=>location.href="deposit.html";
window.goWithdraw=()=>location.href="withdraw.html";
window.copyRef=()=>navigator.clipboard.writeText(refLink.value).then(()=>alert("Copied"));
window.logout=()=>signOut(auth).then(()=>location.href="login.html");

</script>

</body>
</html>
