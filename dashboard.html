<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

body{
  background:#0b0f1a;
  color:#fff;
  padding:16px;
}

.container{
  max-width:430px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
  cursor:pointer;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #2d2cff;
}

.menu{font-size:26px}

.balance{
  font-size:34px;
  font-weight:700;
  color:#00ff9d;
  margin-top:8px;
}

.card{
  background:#111827;
  padding:14px;
  border-radius:14px;
  margin-top:14px;
}

.profit{
  font-size:20px;
  font-weight:700;
  color:gold;
}

.actions{
  display:flex;
  gap:10px;
}

button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

.deposit{background:#2d2cff;color:#fff}
.withdraw{background:#ff2d55;color:#fff}

.tx{
  background:#0b1030;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  font-size:14px;
}

.small{font-size:12px;color:#aaa}
.crypto{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.coin{
  background:#0b1030;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="brand" onclick="openUpload()">
      <img id="avatar" class="avatar" src="https://i.imgur.com/6VBx3io.png">
      <div>
        <b>Dashboard</b>
        <div class="small">Tap photo to change</div>
      </div>
    </div>
    <div class="menu">☰</div>
  </div>

  <!-- BALANCE -->
  <div>Account Balance</div>
  <div id="balance" class="balance">$0.00</div>

  <!-- PROFIT -->
  <div id="profitCard" class="card" style="display:none;">
    <div>Profit</div>
    <div id="profit" class="profit">$0.00</div>
    <div id="locked" class="small"></div>
  </div>

  <!-- CRYPTO -->
  <div class="card crypto">
    <div class="coin">BTC <b id="btc">$0</b></div>
    <div class="coin">ETH <b id="eth">$0</b></div>
    <div class="coin">USDT <b id="usdt">$0</b></div>
    <div class="coin">XRP <b id="xrp">$0</b></div>
  </div>

  <!-- ACTIONS -->
  <div class="card actions">
    <button class="deposit" onclick="goDeposit()">Deposit</button>
    <button class="withdraw" onclick="goWithdraw()">Withdraw</button>
  </div>

  <!-- REF -->
  <div class="card">
    <div>Referral Link</div>
    <input id="ref" readonly style="width:100%;padding:10px;margin-top:8px;border-radius:8px;border:none;">
    <button onclick="copyRef()" style="margin-top:10px;width:100%;background:#2d2cff;color:#fff;padding:10px;border:none;border-radius:8px;">
      Copy
    </button>
  </div>

  <!-- TX -->
  <div class="card">
    <h3>Transactions</h3>
    <div id="history"></div>
  </div>

</div>

<input type="file" id="file" hidden>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, updateDoc, getDoc, collection, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* UI */
const balanceEl = document.getElementById("balance");
const profitCard = document.getElementById("profitCard");
const profitEl = document.getElementById("profit");
const lockedEl = document.getElementById("locked");
const avatar = document.getElementById("avatar");
const fileInput = document.getElementById("file");
const refInput = document.getElementById("ref");
const historyEl = document.getElementById("history");

let userData = null;
let miningStarted = false;

/* ======================
   🔥 MINING SYSTEM (FIXED)
====================== */
async function mine(userRef){

  const snap = await getDoc(userRef);
  if(!snap.exists()) return;

  const d = snap.data();

  const invested = Number(d.invested || 0);
  if(invested <= 0) return;

  const now = Date.now();
  const last = Number(d.lastUpdate || now);

  const hours = (now - last) / 3600000;
  if(hours < 1) return;

  const earned = invested * 0.02 * (hours / 24);

  if(!isFinite(earned) || earned <= 0) return;

  await updateDoc(userRef,{
    lockedProfit: (Number(d.lockedProfit)||0) + earned,
    lastUpdate: now
  });
}

function startMining(user){
  if(miningStarted) return;
  miningStarted = true;

  const ref = doc(db,"users",user.uid);

  mine(ref);
  setInterval(()=>mine(ref),60000);
}

/* ======================
   LIVE CRYPTO PRICES
====================== */
async function loadPrices(){
  const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether,ripple&vs_currencies=usd");
  const d = await r.json();

  document.getElementById("btc").innerText="$"+d.bitcoin.usd.toLocaleString();
  document.getElementById("eth").innerText="$"+d.ethereum.usd.toLocaleString();
  document.getElementById("usdt").innerText="$"+d.tether.usd.toLocaleString();
  document.getElementById("xrp").innerText="$"+d.ripple.usd.toLocaleString();
}
loadPrices();
setInterval(loadPrices,20000);

/* ======================
   AUTH SYSTEM
====================== */
onAuthStateChanged(auth,(user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  const userRef = doc(db,"users",user.uid);

  refInput.value = `https://yourdomain.com/register?ref=${user.uid}`;

  startMining(user);

  /* USER DATA */
  onSnapshot(userRef,(snap)=>{
    const d = snap.data();
    if(!d) return;

    const balance = Number(d.balance||0);
    const profit = Number(d.availableProfit||0);
    const locked = Number(d.lockedProfit||0);

    balanceEl.innerText="$"+balance.toFixed(2);

    if(balance>0 || profit>0 || locked>0){
      profitCard.style.display="block";
      profitEl.innerText="$"+profit.toFixed(2);
      lockedEl.innerText="Locked: $"+locked.toFixed(2);
    }else{
      profitCard.style.display="none";
    }

    if(d.photoURL){
      avatar.src = d.photoURL + "?t=" + Date.now();
    }
  });

  /* TRANSACTIONS */
  const q = query(collection(db,"transactions"),where("userId","==",user.uid));

  onSnapshot(q,(snap)=>{
    historyEl.innerHTML="";
    snap.forEach(doc=>{
      const d = doc.data();

      historyEl.innerHTML += `
        <div class="tx">
          <b>${d.type}</b> - $${d.amount}
          <div class="small">${new Date(d.time).toLocaleString()}</div>
        </div>
      `;
    });
  });
});

/* ======================
   PROFILE UPLOAD FIX
====================== */
window.openUpload = ()=>fileInput.click();

fileInput.onchange = async (e)=>{
  const file = e.target.files[0];
  if(!file || !auth.currentUser) return;

  const imgRef = ref(storage,`avatars/${auth.currentUser.uid}`);

  await uploadBytes(imgRef,file);
  const url = await getDownloadURL(imgRef);

  await updateDoc(doc(db,"users",auth.currentUser.uid),{
    photoURL:url
  });

  avatar.src = url;
};

/* NAV */
window.goDeposit=()=>location.href="deposit.html";
window.goWithdraw=()=>location.href="withdraw.html";
window.copyRef=()=>navigator.clipboard.writeText(refInput.value);

</script>

</body>
  </html>
