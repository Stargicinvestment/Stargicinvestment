<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

body{
  background:#0b0f1a;
  color:#fff;
  padding:18px;
}

.container{max-width:430px;margin:auto}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #2d2cff;
}

.menu{font-size:26px}

/* BALANCE */
.balance{
  font-size:36px;
  font-weight:700;
  color:#00ff9d;
  margin-top:8px;
}

/* CARD */
.card{
  background:#111827;
  padding:16px;
  border-radius:14px;
  margin-top:16px;
}

/* PROFIT */
.profit{
  color:gold;
  font-size:20px;
  font-weight:700;
  margin-top:6px;
}

/* BUTTONS */
.actions{display:flex;gap:12px}

button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

.deposit{background:#2d2cff;color:#fff}
.withdraw{background:#ff2d55;color:#fff}

/* CRYPTO */
.crypto{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.coin{
  background:#0b1030;
  padding:10px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
}

/* REF */
input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
}

.small{font-size:12px;color:#aaa;margin-top:4px}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="brand" onclick="openUpload()">
      <img id="avatar" class="avatar" src="https://i.imgur.com/6VBx3io.png">
      <div>
        <b>Dashboard</b>
        <div class="small">Tap photo to change</div>
      </div>
    </div>

    <div class="menu">☰</div>
  </div>

  <!-- BALANCE -->
  <div>Account Balance</div>
  <div id="balance" class="balance">$0.00</div>

  <!-- PROFIT -->
  <div id="profitCard" class="card" style="display:none">
    <div>Profit</div>
    <div id="profit" class="profit">$0.00</div>
    <div id="locked" class="small"></div>
  </div>

  <!-- ACTIONS -->
  <div class="card actions">
    <button class="deposit" onclick="goDeposit()">Deposit</button>
    <button class="withdraw" onclick="goWithdraw()">Withdraw</button>
  </div>

  <!-- CRYPTO -->
  <div class="card crypto">
    <div class="coin">BTC <b id="btc">$0</b></div>
    <div class="coin">ETH <b id="eth">$0</b></div>
    <div class="coin">USDT <b id="usdt">$0</b></div>
    <div class="coin">XRP <b id="xrp">$0</b></div>
  </div>

  <!-- REF -->
  <div class="card">
    <div>Referral Link</div>
    <input id="ref" readonly>
    <button onclick="copyRef()" style="margin-top:10px;background:#2d2cff;color:#fff;width:100%">
      Copy Referral
    </button>
  </div>

</div>

<input type="file" id="file" hidden>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ✅ YOUR FIREBASE CONFIG (FILLED) */
const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* ELEMENTS */
const balanceEl = document.getElementById("balance");
const profitCard = document.getElementById("profitCard");
const profitEl = document.getElementById("profit");
const lockedEl = document.getElementById("locked");
const avatar = document.getElementById("avatar");
const fileInput = document.getElementById("file");
const refInput = document.getElementById("ref");

/* AUTH */
let currentUser = null;

onAuthStateChanged(auth,(user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  currentUser = user;

  const userRef = doc(db,"users",user.uid);

  onSnapshot(userRef,(snap)=>{
    const d = snap.data();
    if(!d) return;

    const balance = Number(d.balance||0);
    const profit = Number(d.availableProfit||0);
    const locked = Number(d.lockedProfit||0);

    balanceEl.innerText="$"+balance.toFixed(2);

    if(balance>0 || profit>0){
      profitCard.style.display="block";
      profitEl.innerText="$"+profit.toFixed(2);
      lockedEl.innerText="Locked: $"+locked.toFixed(2);
    }else{
      profitCard.style.display="none";
    }

    if (d.photoURL && d.photoURL !== "") {
  avatar.src = d.photoURL + "?t=" + Date.now();
  }

  refInput.value = `https://yourdomain.com/register?ref=${user.uid}`;
});

/* CRYPTO */
async function loadPrices(){
  const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether,ripple&vs_currencies=usd");
  const d = await r.json();

  document.getElementById("btc").innerText="$"+d.bitcoin.usd;
  document.getElementById("eth").innerText="$"+d.ethereum.usd;
  document.getElementById("usdt").innerText="$"+d.tether.usd;
  document.getElementById("xrp").innerText="$"+d.ripple.usd;
}
loadPrices();
setInterval(loadPrices,30000);

window.openUpload = () => fileInput.click();

fileInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file || !currentUser) return;

  const imgRef = ref(storage, `avatars/${currentUser.uid}`);

  await uploadBytes(imgRef, file);

  const url = await getDownloadURL(imgRef);

  // FORCE cache refresh (IMPORTANT FIX)
  const cacheBustedUrl = url + "?t=" + Date.now();

  await updateDoc(doc(db, "users", currentUser.uid), {
    photoURL: cacheBustedUrl
  });

  // 🔥 UPDATE IMMEDIATELY (DON'T WAIT FOR SNAPSHOT)
  document.getElementById("avatar").src = cacheBustedUrl;
};

/* COPY REF */
window.copyRef=()=>{
  navigator.clipboard.writeText(refInput.value);
  alert("Copied");
};

/* NAV */
window.goDeposit=()=>location.href="deposit.html";
window.goWithdraw=()=>location.href="withdraw.html";

</script>

</body>
  </html>
