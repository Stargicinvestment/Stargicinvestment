<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0f1a;
  color:#fff;
}

.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#111827;
}

.container{padding:20px;}

.card{
  background:#111827;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
}

.balance{color:#00ff9d;font-size:40px;font-weight:bold;}
.profit{color:gold;font-size:30px;font-weight:bold;}

.actions{display:flex;gap:10px;}

button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.deposit{background:#00e676;}
.withdraw{background:#ff5252;color:#fff;}

.history-box{
  max-height:250px;
  overflow-y:auto;
}
</style>
</head>

<body>

<div class="header">
  <h2>Dashboard</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

<h2 id="welcome">Welcome</h2>

<div class="card">
  <p>Balance</p>
  <div id="balance" class="balance">$0</div>

  <div id="capitalBox" style="display:none;margin-top:10px;">
    <small>Capital Locked</small>
    <div id="invested">$0</div>
  </div>
</div>

<div class="card">
  <p>Profit</p>
  <div id="profit" class="profit">$0</div>
</div>

<div class="card">
  <div class="actions">
    <button class="deposit" onclick="goDeposit()">Deposit</button>
    <button class="withdraw" onclick="goWithdraw()">Withdraw</button>
  </div>
</div>

<div class="card">
  <h3>Transactions</h3>
  <div id="history" class="history-box"></div>
</div>

<div class="card">
  <h3>Withdraw Requests</h3>
  <div id="withdrawHistory" class="history-box"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔥 YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// PLANS
const plans = {
  Basic: 0.02,
  Silver: 0.025,
  Elite: 0.03,
  Premium: 0.035,
  VIP: 0.04
};

// 🔥 SAFE MINING
async function runMining(ref){

  const snap = await getDoc(ref);
  if(!snap.exists()) return;

  const d = snap.data();

  const invested = Number(d.invested || 0);
  const plan = d.plan;
  const now = Date.now();

  if(invested <= 0 || !plan) return;

  const rate = plans[plan];
  if(!rate) return;

  const last = Number(d.lastUpdate || now);

  let hours = (now - last) / 3600000;
  if(hours <= 0) return;
  if(hours > 1) hours = 1;

  let earned = invested * rate * (hours / 24);

  let locked = Number(d.lockedProfit || 0);
  let available = Number(d.availableProfit || 0);

  locked += earned;

  await updateDoc(ref,{
    lockedProfit: locked,
    availableProfit: available,
    lastUpdate: now
  });
}

// 🔥 MINING LOOP
let interval;

function startMining(user){
  const ref = doc(db,"users",user.uid);

  if(interval) clearInterval(interval);

  runMining(ref);

  interval = setInterval(()=>{
    runMining(ref);
  }, 60000);
}

// 🔥 AUTH
onAuthStateChanged(auth, async (user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  const ref = doc(db,"users",user.uid);
  const snap = await getDoc(ref);
  const d = snap.data();

  document.getElementById("welcome").innerText =
    "Welcome " + (d.name || "User");

  startMining(user);

  // LIVE USER DATA
  onSnapshot(ref,(snap)=>{

    const d = snap.data();

    document.getElementById("balance").innerText =
      "$" + (d.balance || 0).toFixed(2);

    const invested = d.invested || 0;

    if(invested > 0){
      document.getElementById("capitalBox").style.display="block";
      document.getElementById("invested").innerText =
        "$" + invested.toFixed(2);
    }

    document.getElementById("profit").innerText =
      "$" + (d.availableProfit || 0).toFixed(2);

  });

  // TRANSACTIONS
  const tq = query(collection(db,"transactions"),where("userId","==",user.uid));

  onSnapshot(tq,(snap)=>{
    const box = document.getElementById("history");
    box.innerHTML = "";

    snap.forEach(doc=>{
      const d = doc.data();
      box.innerHTML += `<div>${d.type} - $${d.amount}</div>`;
    });
  });

  // WITHDRAWALS
  const wq = query(collection(db,"withdrawals"),where("userId","==",user.uid));

  onSnapshot(wq,(snap)=>{
    const box = document.getElementById("withdrawHistory");
    box.innerHTML = "";

    snap.forEach(doc=>{
      const d = doc.data();
      box.innerHTML += `<div>${d.status} - $${d.amount}</div>`;
    });
  });

});

// ACTIONS
window.logout = ()=>signOut(auth);
window.goDeposit = ()=>location.href="deposit.html";
window.goWithdraw = ()=>location.href="withdraw.html";

</script>

</body>
</html>
