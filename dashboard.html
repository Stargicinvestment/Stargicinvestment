<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
  :root{
  --bg:#0b0f1a;
  --card:#111827;
  --text:#ffffff;
  --subtext:#aaaaaa;
}

.light-mode{
  --bg:#f5f5f5;
  --card:#ffffff;
  --text:#111111;
  --subtext:#555555;
}
  .card{
  background:#111827;
  padding:20px;
  border-radius:16px;
  margin-top:20px;
  box-shadow:0 4px 15px rgba(0,0,0,0.4);
}

.balance{
  color:#00ff9d;
  font-size:42px;
  font-weight:bold;
}

.profit{
  color:gold;
  font-size:34px;
  font-weight:bold;
}

.card p{
  color:var(--subtext);
}
.goog-te-banner-frame.skiptranslate {
  display: none !important;
}

body {
  top: 0px !important;
}

iframe.goog-te-banner-frame {
  display: none !important;
}

.goog-te-gadget {
  display: none !important;
}

.goog-logo-link {
  display: none !important;
}
  
*{box-sizing:border-box;}

body{
  background:var(--bg);
  color:var(--text);
}

.header{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#111827;
}

.container{padding:20px;}

.card p{
  color:var(--subtext);
}

.balance{color:#00ff9d;font-size:40px;}
.profit{color:gold;font-size:30px;}

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
.history-box{
  max-height: 250px;     /* 🔥 prevents stretching */
  overflow-y: auto;      /* 🔥 enables scroll */
  margin-top:10px;
  padding-right:5px;
}
  .history-box{
  max-height: 250px;
  overflow-y: auto;
  margin-top:10px;
  padding-right:5px;
}

/* 🔥 FIX OVERFLOW TEXT */
.history-box div{
  word-break: break-all;
  overflow-wrap: break-word;
}
.deposit{background:#00e676;color:#000;}
.withdraw{background:#ff5252;color:#fff;}
</style>
</head>

<body>

<div class="header">
  <h2>Dashboard</h2>
  <button onclick="logout()">Logout</button>
</div>

<div class="container">

  <h2 id="welcome">Welcome</h2>

<!-- BALANCE CARD -->
  <div class="card">
  <p>Balance</p>
  <div id="balance" class="balance">$0</div>

  <!-- Capital Locked -->
  <div id="capitalBox" style="display:none;margin-top:10px;">
    <div style="font-size:13px;color:#aaa;">
      Capital Locked
    </div>
    <div id="invested" style="color:#00e676;font-size:18px;">
      $0
    </div>
  </div>
</div>

<!-- PROFIT CARD -->
<div class="card">
  <p>Profit</p>
  <div id="profit" class="profit">$0</div>
</div>

<!-- ACTIONS -->
<div class="card">
  <div class="actions">
    <button class="btn deposit" onclick="goDeposit()">Deposit</button>
    <button class="btn withdraw" onclick="goWithdraw()">Withdraw</button>
  </div>



<!-- TRANSACTIONS -->
<div class="card">
  <h3>Transactions</h3>
  <div id="history" class="history-box"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  collection,
  query,
  where,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const plans = {
  starter: { rate: 0.025, duration: 7 },
  silver: { rate: 0.035, duration: 7 },
  gold: { rate: 0.045, duration: 7 },
  platinum: { rate: 0.055, duration: 7 },
  vip: { rate: 0.066, duration: 7 }
};

let miningRunning = false;

// ✅ MINING FUNCTION
async function runMining(userRef){

  const snap = await getDoc(userRef);
  if(!snap.exists()) return;

  const data = snap.data();

  let invested = Number(data.invested) || 0;
  if(invested <= 0){
    return; // ✅ stops mining completely
  }

  let lockedProfit = Number(data.lockedProfit) || 0;

  if(!invested || !data.plan) return;

  const plan = plans[data.plan];
  if(!plan) return;

  let start = Number(data.startTime);
  let last = data.lastUpdate ? Number(data.lastUpdate) : Date.now();
  let now = Date.now();

  let depositStart = Number(data.depositStart) || now;
let depositDays = (now - depositStart) / (1000 * 60 * 60 * 24);

if(depositDays >= 21 && invested > 0){

  await updateDoc(userRef,{
    balance: (Number(data.balance) || 0) + invested,
    invested: 0,
    plan: null
  });

  console.log("Capital released");

  return; // stop mining
}

  // ✅ ADD THIS BLOCK HERE
  let profitStart = Number(data.profitStart) || now;
  let profitDays = (now - profitStart) / (1000 * 60 * 60 * 24);

if(profitDays >= 7 && (data.lockedProfit || 0) > 0){

  await updateDoc(userRef,{
    availableProfit: (Number(data.availableProfit) || 0) + (Number(data.lockedProfit) || 0),
    lockedProfit: 0,
    profitStart: Date.now()
  });

  console.log("Profit unlocked");
}


  // CALCULATE HOURS
  let hours = (now - last) / (1000 * 60 * 60);

  let earned = invested * plan.rate * (hours / 24);

  if(!isFinite(earned) || earned <= 0) return;

  await updateDoc(userRef,{
    lockedProfit: lockedProfit + earned,
    lastUpdate: now
  });

  console.log("MINED:", earned);
}

// ✅ START LOOP
function startMining(user){

  if(miningRunning) return;
  miningRunning = true;

  const userRef = doc(db,"users",user.uid);

  runMining(userRef);

  setInterval(()=>{
    runMining(userRef);
  },60000);
}

// AUTH
onAuthStateChanged(auth, async (user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  const userRef = doc(db,"users",user.uid);

  const snap = await getDoc(userRef);
  if(!snap.exists()) return;

  let data = snap.data();
  let name = data.name || user.email.split("@")[0];

  document.getElementById("welcome").innerText =
    "Welcome, " + name;

  // REALTIME UI
onSnapshot(userRef,(docSnap)=>{

  let d = docSnap.data();

let balance = Number(d.balance) || 0;
let invested = Number(d.invested) || 0;
let availableProfit = Number(d.availableProfit) || 0;
let lockedProfit = Number(d.lockedProfit) || 0;

// Balance
document.getElementById("balance").innerText =
  "$" + balance.toFixed(2);

// Capital (only show if balance > 0)
const capitalBox = document.getElementById("capitalBox");

if(balance > 0){
  capitalBox.style.display = "block";

  document.getElementById("invested").innerText =
    "$" + invested.toFixed(2);
}else{
  capitalBox.style.display = "none";
}

// Profit
document.getElementById("profit").innerHTML = `
  $${availableProfit.toFixed(2)}
  
  <div style="font-size:13px;color:gray;">
    Locked Profit: $${lockedProfit.toFixed(2)}
  </div>
`;
  


  startMining(user);

  // TRANSACTIONS
  const q = query(
    collection(db,"transactions"),
    where("userId","==",user.uid)
  );

  onSnapshot(q,(snapshot)=>{
    let box = document.getElementById("history");
    box.innerHTML="";

    snapshot.forEach((docItem)=>{

      let d = docItem.data();

      let color = d.type === "deposit"
        ? "lightgreen"
        : "#ff6b6b";

  box.innerHTML += `
  <div style="
    background:#0b0f1a;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
  ">
    
    <div style="display:flex;justify-content:space-between;">
      <b style="color:${color};">${d.type.toUpperCase()}</b>
      <span>$${Number(d.amount).toFixed(2)}</span>
    </div>

    ${d.wallet ? `
      <div style="
        margin-top:8px;
        font-size:13px;
        color:#aaa;
        word-break:break-all;
      ">
        Wallet: ${d.wallet}
      </div>
    ` : ""}

    <div style="margin-top:8px;font-size:12px;color:gray;">
      ${new Date(d.time).toLocaleString()}
    </div>

  </div>
`;
    });
  });

});

// ACTIONS
window.logout = function(){
  signOut(auth);
  location.href="login.html";
};

window.goDeposit = function(){
  location.href="deposit.html";
};

window.goWithdraw = function(){
  location.href="withdraw.html";
};


  await updateDoc(userRef,{
    invested: balance,      // move all money to invested
    balance: 0,             // ✅ ZERO BALANCE
    plan: "starter",
    startTime: Date.now(),
    lastUpdate: Date.now(),
    profitStart: Date.now(),   // 7 days lock
    depositStart: Date.now()   // 21 days lock
  });

  alert("Investment started!");
};

</script>
<div id="google_translate_element" style="display:none;"></div>

function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    autoDisplay: false
  }, 'google_translate_element');
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</html>
