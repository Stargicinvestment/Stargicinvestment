<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - Demo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Poppins,sans-serif;
}

body{
  background:#0b0f1a;
  color:#fff;
  padding:16px;
}

.container{
  max-width:430px;
  margin:auto;
  padding-bottom:40px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #2d2cff;
}

.settings{
  color:#fff;
  text-decoration:none;
  background:#2d2cff;
  padding:8px 13px;
  border-radius:8px;
  font-size:13px;
}

.balance-label{
  color:#aaa;
  font-size:13px;
}

.balance{
  font-size:36px;
  font-weight:700;
  color:#00ff9d;
  margin-top:4px;
}

.card{
  background:#111827;
  border-radius:16px;
  padding:16px;
  margin-top:16px;
}

.mining-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.small{
  color:#aaa;
  font-size:12px;
}

.plan{
  color:#8da2ff;
  font-size:18px;
  font-weight:600;
  margin-top:3px;
}

.status{
  background:#123d2d;
  color:#00ff9d;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:600;
}

.capital{
  color:#00ff9d;
  font-size:25px;
  font-weight:700;
  margin-top:4px;
}

.rate{
  color:#ffd700;
  font-weight:600;
}

.profit{
  color:#ffd700;
  font-size:23px;
  font-weight:700;
}

.progress{
  height:8px;
  background:#202738;
  border-radius:20px;
  margin-top:14px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#2d2cff,#00ff9d);
}

.next{
  color:#aaa;
  font-size:11px;
  margin-top:8px;
}

.actions{
  display:flex;
  gap:10px;
}

button{
  border:0;
  padding:12px;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

.deposit{
  flex:1;
  background:#2d2cff;
  color:#fff;
}

.withdraw{
  flex:1;
  background:#ff3155;
  color:#fff;
}

input{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  margin-top:10px;
  outline:none;
}

.tx{
  background:#0b1030;
  padding:12px;
  border-radius:10px;
  margin-top:9px;
}

.tx-top{
  display:flex;
  justify-content:space-between;
}

.demo{
  color:#ffcc00;
  font-size:11px;
  margin-top:18px;
  text-align:center;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="brand">
      <img
        id="avatar"
        class="avatar"
        src="https://i.imgur.com/6VBx3io.png"
      >

      <div>
        <b id="welcome">Welcome 👋</b>
      </div>
    </div>

    <a class="settings" href="settings.html">
      Settings
    </a>

  </div>


  <div class="balance-label">
    Account Balance
  </div>

  <div id="balance" class="balance">
    $0.00
  </div>


  <!-- MINING -->

  <div id="miningBox" class="card" style="display:none;">

    <div class="mining-head">

      <div>
        <div class="small">
          Current Mining Plan
        </div>

        <div id="plan" class="plan">
          -
        </div>
      </div>

      <div id="status" class="status">
        MINING
      </div>

    </div>


    <div style="margin-top:16px">

      <div class="small">
        Total Mining Capital
      </div>

      <div id="capital" class="capital">
        $0.00
      </div>

    </div>


    <div style="margin-top:12px">

      <div class="small">
        Current Rate
      </div>

      <div id="rate" class="rate">
        0%
      </div>

    </div>


    <div style="margin-top:12px">

      <div class="small">
        Simulated Profit
      </div>

      <div id="profit" class="profit">
        $0.00
      </div>

    </div>


    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="next" class="next">
      Mining active
    </div>

  </div>


  <!-- ACTIONS -->

  <div class="card actions">

    <button
      class="deposit"
      onclick="location.href='deposit.html'"
    >
      Deposit
    </button>

    <button
      class="withdraw"
      onclick="location.href='withdraw.html'"
    >
      Withdraw
    </button>

  </div>


  <!-- REFERRAL -->

  <div class="card">

    <div>
      Referral Link
    </div>

    <input
      id="ref"
      readonly
    >

    <button
      style="
        width:100%;
        margin-top:10px;
        background:#2d2cff;
        color:white;
      "
      onclick="copyReferral()"
    >
      Copy Referral
    </button>

  </div>


  <!-- TRANSACTIONS -->

  <div class="card">

    <h3>
      Transactions
    </h3>

    <div id="transactions"></div>

  </div>


  <div class="demo">
    DEMO/SIMULATION MODE — values shown here are for testing only.
  </div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  onSnapshot,
  collection,
  query,
  where,
  onSnapshot as listenCollection
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",

  authDomain:
    "stargicinvestment.firebaseapp.com",

  projectId:
    "stargicinvestment",

  storageBucket:
    "stargicinvestment.appspot.com",

  messagingSenderId:
    "1053305294931",

  appId:
    "1:1053305294931:web:87cba3260a83030e56f6a6"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const DAY =
  24 * 60 * 60 * 1000;


/*
  PLAN TABLE
*/

const PLANS = [

  {
    name:"Basic",
    min:1,
    max:1999.99,
    rate:0.02
  },

  {
    name:"Silver",
    min:2000,
    max:9999.99,
    rate:0.025
  },

  {
    name:"Elite",
    min:10000,
    max:49999.99,
    rate:0.03
  },

  {
    name:"Premium",
    min:50000,
    max:99999.99,
    rate:0.035
  },

  {
    name:"VIP",
    min:100000,
    max:1000000,
    rate:0.04
  }

];


function number(value){

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


function getPlan(capital){

  return PLANS.find(
    plan =>
      capital >= plan.min &&
      capital <= plan.max
  ) || null;

}


/*
  Calculate current simulated profit
  from the ONE combined capital.
*/

function calculateMining(data){

  const capital =
    number(data.miningCapital);

  const start =
    number(data.miningStartTime);

  const plan =
    getPlan(capital);

  if(
    capital <= 0 ||
    !plan ||
    !start
  ){

    return null;

  }


  const elapsed =
    Math.max(
      0,
      Date.now() - start
    );

  const days =
    elapsed / DAY;


  const profit =
    capital *
    plan.rate *
    days;


  return {

    capital,
    plan:plan.name,
    rate:plan.rate,
    profit

  };

}


/*
  AUTH
*/

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      location.href =
        "login.html";

      return;

    }


    const userRef =
      doc(
        db,
        "users",
        user.uid
      );


    document.getElementById(
      "ref"
    ).value =
      location.origin +
      location.pathname
        .replace(
          "dashboard.html",
          "register.html"
        ) +
      "?ref=" +
      user.uid;


    onSnapshot(
      userRef,
      snapshot => {

        if(!snapshot.exists()){

          return;

        }


        const data =
          snapshot.data();


        document.getElementById(
          "welcome"
        ).textContent =
          "Welcome, " +
          (
            data.fullName ||
            data.name ||
            "User"
          );


        document.getElementById(
          "balance"
        ).textContent =
          "$" +
          number(
            data.balance
          ).toFixed(2);


        if(data.photoURL){

          document.getElementById(
            "avatar"
          ).src =
            data.photoURL;

        }


        renderMining(data);

      }
    );


    const txQuery =
      query(
        collection(
          db,
          "transactions"
        ),
        where(
          "userId",
          "==",
          user.uid
        )
      );


    listenCollection(
      txQuery,
      snapshot => {

        const box =
          document.getElementById(
            "transactions"
          );

        box.innerHTML = "";


        if(snapshot.empty){

          box.innerHTML =
            '<div class="tx">No transactions yet.</div>';

          return;

        }


        snapshot.forEach(
          item => {

            const d =
              item.data();


            box.innerHTML += `

              <div class="tx">

                <div class="tx-top">

                  <b>
                    ${String(
                      d.type || "transaction"
                    ).toUpperCase()}
                  </b>

                  <span>
                    $${number(
                      d.amount
                    ).toFixed(2)}
                  </span>

                </div>

              </div>

            `;

          }
        );

      }
    );

  }
);


/*
  RENDER MINING
*/

function renderMining(data){

  const mining =
    calculateMining(data);


  const box =
    document.getElementById(
      "miningBox"
    );


  if(!mining){

    box.style.display =
      "none";

    return;

  }


  box.style.display =
    "block";


  document.getElementById(
    "plan"
  ).textContent =
    mining.plan;


  document.getElementById(
    "capital"
  ).textContent =
    "$" +
    mining.capital.toFixed(2);


  document.getElementById(
    "rate"
  ).textContent =
    (
      mining.rate * 100
    ).toFixed(2) +
    "% daily";


  document.getElementById(
    "profit"
  ).textContent =
    "$" +
    mining.profit.toFixed(2);


  /*
    Visual seven-day cycle.
  */

  const start =
    number(
      data.miningStartTime
    );


  const elapsed =
    Math.max(
      0,
      Date.now() - start
    );


  const cycle =
    7 * DAY;


  const progress =
    Math.min(
      100,
      (elapsed % cycle) /
      cycle *
      100
    );


  document.getElementById(
    "progressBar"
  ).style.width =
    progress + "%";


  const remaining =
    cycle -
    (elapsed % cycle);


  const hours =
    Math.floor(
      remaining /
      (60 * 60 * 1000)
    );


  const minutes =
    Math.floor(
      (
        remaining %
        (60 * 60 * 1000)
      ) /
      (60 * 1000)
    );


  document.getElementById(
    "next"
  ).textContent =
    "Current cycle: " +
    hours +
    "h " +
    minutes +
    "m remaining";

}


/*
  Refresh displayed simulated profit.
*/

setInterval(
  async() => {

    if(!auth.currentUser){

      return;

    }

    /*
      Firestore remains the source of
      the capital/start timestamp.
      The displayed profit is recalculated
      from those values.
    */

  },
  60000
);


/*
  COPY REFERRAL
*/

window.copyReferral =
  async function(){

    const value =
      document.getElementById(
        "ref"
      ).value;

    await navigator.clipboard.writeText(
      value
    );

    alert("Referral copied.");

  };

</script>

</body>
</html>
