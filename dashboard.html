<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#0b0f1a;
  color:white;
}

.container{
  max-width:430px;
  margin:auto;
  padding:16px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
}

.logo{width:65px;}
.menu{font-size:26px;cursor:pointer;}

/* BALANCE */
h2{font-size:18px;margin-top:10px;}

.balance{
  font-size:32px;
  font-weight:700;
  color:#00ff9d;
}

/* PROFIT */
.card{
  background:#111827;
  padding:14px;
  border-radius:14px;
  margin-top:14px;
}

.profit{
  font-size:22px;
  font-weight:700;
  color:gold;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:10px;
}

button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

.deposit{background:#2d2cff;color:white;}
.withdraw{background:#ff2d55;color:white;}

/* CRYPTO */
.crypto-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.coin{
  background:#0b1030;
  padding:12px;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:10px;
}

.coin img{width:26px;height:26px;}
.coin h3{font-size:14px;}

/* REF */
.ref{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.ref input{
  padding:12px;
  border:none;
  border-radius:8px;
  outline:none;
}

.ref button{
  background:#2d2cff;
  color:white;
}

/* TX */
.tx{
  background:#0b1030;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.tx-top{
  display:flex;
  justify-content:space-between;
}

.gray{
  color:#aaa;
  font-size:12px;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <img src="https://i.imgur.com/6VBx3io.png" class="logo">
    <div class="menu">☰</div>
  </div>

  <h2>Account Balance</h2>
  <div id="balance" class="balance">$0.00</div>

  <!-- PROFIT (ONLY SHOW WHEN REAL DATA EXISTS) -->
  <div id="profitCard" class="card" style="display:none;">
    <h3>Profit Overview</h3>
    <div id="profit" class="profit">$0.00</div>
    <div id="locked" style="font-size:12px;color:#aaa;margin-top:5px;"></div>
  </div>

  <!-- CRYPTO PRICES -->
  <div class="card crypto-grid">
    <div class="coin"><img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png"><h3 id="btc">$0</h3></div>
    <div class="coin"><img src="https://cryptologos.cc/logos/ethereum-eth-logo.png"><h3 id="eth">$0</h3></div>
    <div class="coin"><img src="https://cryptologos.cc/logos/tether-usdt-logo.png"><h3 id="usdt">$0</h3></div>
    <div class="coin"><img src="https://cryptologos.cc/logos/xrp-xrp-logo.png"><h3 id="xrp">$0</h3></div>
  </div>

  <!-- REFERRAL -->
  <div class="card">
    <h3>Referral Program</h3>
    <div class="ref">
      <input id="refLink" value="https://stargicinvestment.com/ref" readonly>
      <button onclick="copyRef()">Copy Link</button>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="card actions">
    <button class="deposit" onclick="goDeposit()">Deposit</button>
    <button class="withdraw" onclick="goWithdraw()">Withdraw</button>
  </div>

  <!-- TRANSACTIONS -->
  <div class="card">
    <h3>Transactions</h3>
    <div id="history"></div>
  </div>

  <!-- WITHDRAWALS -->
  <div class="card">
    <h3>Withdraw Requests</h3>
    <div id="withdrawHistory"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, onAuthStateChanged, signOut,
  setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc, onSnapshot,
  collection, query, where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ✅ YOUR FIREBASE CONFIG (FILLED) */
const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

setPersistence(auth, browserLocalPersistence);

/* ELEMENTS */
const balanceEl = document.getElementById("balance");
const profitCard = document.getElementById("profitCard");
const profitEl = document.getElementById("profit");
const lockedEl = document.getElementById("locked");

const btc = document.getElementById("btc");
const eth = document.getElementById("eth");
const usdt = document.getElementById("usdt");
const xrp = document.getElementById("xrp");

const historyEl = document.getElementById("history");
const withdrawEl = document.getElementById("withdrawHistory");
const refLink = document.getElementById("refLink");

/* CRYPTO PRICES */
async function loadPrices(){
  try{
    const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether,ripple&vs_currencies=usd");
    const d = await r.json();

    btc.innerText="$"+d.bitcoin.usd.toLocaleString();
    eth.innerText="$"+d.ethereum.usd.toLocaleString();
    usdt.innerText="$"+d.tether.usd.toLocaleString();
    xrp.innerText="$"+d.ripple.usd.toLocaleString();
  }catch(e){}
}
loadPrices();
setInterval(loadPrices,30000);

/* AUTH */
onAuthStateChanged(auth,(user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  const ref = doc(db,"users",user.uid);

  onSnapshot(ref,(snap)=>{
    const d = snap.data();
    if(!d) return;

    const balance = Number(d.balance)||0;
    const profit = Number(d.availableProfit)||0;
    const locked = Number(d.lockedProfit)||0;

    balanceEl.innerText="$"+balance.toFixed(2);

    /* ONLY SHOW PROFIT IF REAL ACTIVITY EXISTS */
    if(balance > 0 || profit > 0 || locked > 0){
      profitCard.style.display="block";
      profitEl.innerText="$"+profit.toFixed(2);
      lockedEl.innerText="Locked: $"+locked.toFixed(2);
    }else{
      profitCard.style.display="none";
    }
  });

  /* TRANSACTIONS */
  onSnapshot(query(collection(db,"transactions"),where("userId","==",user.uid)),(snap)=>{
    historyEl.innerHTML="";
    snap.forEach(docu=>{
      const d = docu.data();

      historyEl.innerHTML+=`
      <div class="tx">
        <div class="tx-top">
          <b>${d.type.toUpperCase()}</b>
          <span>$${Number(d.amount).toFixed(2)}</span>
        </div>
        <div class="gray">${new Date(d.time).toLocaleString()}</div>
      </div>`;
    });
  });

  /* WITHDRAWALS */
  onSnapshot(query(collection(db,"withdrawals"),where("userId","==",user.uid)),(snap)=>{
    withdrawEl.innerHTML="";
    snap.forEach(docu=>{
      const d = docu.data();

      withdrawEl.innerHTML+=`
      <div class="tx">
        <div class="tx-top">
          <b>${d.status.toUpperCase()}</b>
          <span>$${Number(d.amount).toFixed(2)}</span>
        </div>
        <div class="gray">${d.coin}</div>
      </div>`;
    });
  });

});

/* ACTIONS */
window.goDeposit=()=>location.href="deposit.html";
window.goWithdraw=()=>location.href="withdraw.html";
window.copyRef=()=>navigator.clipboard.writeText(refLink.value).then(()=>alert("Copied"));
window.logout=()=>signOut(auth).then(()=>location.href="login.html");

</script>

</body>
</html>
