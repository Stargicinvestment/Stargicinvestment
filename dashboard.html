<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:#02011a;
  color:white;
  overflow-x:hidden;
  font-size:14px;
}

.container{
  width:100%;
  max-width:480px;
  margin:0 auto;
  padding:14px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{width:70px;}
.menu{font-size:28px;color:#ddd;cursor:pointer;}

.balance-title{font-size:18px;font-weight:700;margin-bottom:10px;}
.balance,.profit{font-size:20px;font-weight:700;margin-bottom:8px;word-break:break-word;}
.credit{color:#aaa;font-size:13px;}

.card{
  background:#111827;
  padding:16px;
  border-radius:16px;
  margin-top:15px;
}

.crypto{margin-top:25px;}
.coin{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.coin-left{
  width:45px;height:45px;border-radius:10px;
  overflow:hidden;display:flex;justify-content:center;align-items:center;
  background:#111;flex-shrink:0;
}
.coin-left img{width:26px;height:26px;}
.coin-right small{color:#2d2cff;font-size:13px;}
.coin-right h2{font-size:18px;}

.section{margin-top:25px;}
.section h2{font-size:16px;margin-bottom:10px;}

.history-box{max-height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}

.tx{background:#0b1030;padding:12px;border-radius:10px;}
.tx-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;}
.gray{color:#aaa;font-size:11px;margin-top:5px;}

.green{color:#00ff88;}
.red{color:#ff4d4d;}
.orange{color:orange;}

.overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.6);display:none;z-index:99;
}
.menu-box{
  position:absolute;right:0;top:0;width:70%;height:100%;
  background:#0b1030;padding:20px;
}
.menu-box a{
  display:block;color:white;padding:15px 0;
  text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.1);
}

</style></head>
<body><div class="overlay" id="overlay" onclick="closeMenu()">
  <div class="menu-box" onclick="event.stopPropagation()">
    <a href="index.html">Home</a>
    <a href="deposit.html">Deposit</a>
    <a href="withdraw.html">Withdraw</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</div><div class="container"><div class="topbar">
  <img src="https://i.imgur.com/6VBx3io.png" class="logo">
  <div class="menu" onclick="openMenu()">☰</div>
</div><h1 class="balance-title">Account Balance</h1>
<div id="balance" class="balance">$0.00</div>
<div id="profit" class="profit">$0.00</div>
<div class="credit">Credit Balance</div><!-- CRYPTO --><div class="card crypto"><div class="coin"><div class="coin-left"><img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png"></div><div class="coin-right"><small>BTC</small><h2 id="btcPrice">$0</h2></div></div>
<div class="coin"><div class="coin-left"><img src="https://cryptologos.cc/logos/ethereum-eth-logo.png"></div><div class="coin-right"><small>ETH</small><h2 id="ethPrice">$0</h2></div></div>
<div class="coin"><div class="coin-left"><img src="https://cryptologos.cc/logos/tether-usdt-logo.png"></div><div class="coin-right"><small>USDT</small><h2 id="usdtPrice">$0</h2></div></div>
<div class="coin"><div class="coin-left"><img src="https://cryptologos.cc/logos/xrp-xrp-logo.png"></div><div class="coin-right"><small>XRP</small><h2 id="xrpPrice">$0</h2></div></div></div><div class="card section">
<h2>Transactions</h2>
<div id="history" class="history-box"></div>
</div><div class="card section">
<h2>Withdraw Requests</h2>
<div id="withdrawHistory" class="history-box"></div>
</div></div><script>
function openMenu(){document.getElementById('overlay').style.display='block';}
function closeMenu(){document.getElementById('overlay').style.display='none';}
</script><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const balanceEl=document.getElementById("balance");
const profitEl=document.getElementById("profit");
const historyEl=document.getElementById("history");
const withdrawEl=document.getElementById("withdrawHistory");

// PRICES
async function loadPrices(){
  try{
    const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether,ripple&vs_currencies=usd');
    const d=await r.json();
    btcPrice.innerText="$"+d.bitcoin.usd.toLocaleString();
    ethPrice.innerText="$"+d.ethereum.usd.toLocaleString();
    usdtPrice.innerText="$"+d.tether.usd.toLocaleString();
    xrpPrice.innerText="$"+d.ripple.usd.toLocaleString();
  }catch(e){}
}
loadPrices();setInterval(loadPrices,30000);

const plans={Basic:{rate:0.02},Silver:{rate:0.025},Elite:{rate:0.03},Premium:{rate:0.035},VIP:{rate:0.04}};
let miningRunning=false;

async function runMining(ref){
  const s=await getDoc(ref);
  if(!s.exists())return;
  const d=s.data();

  let invested=Number(d.invested)||0;
  if(invested<=0||!d.plan)return;

  const plan=plans[d.plan];
  if(!plan)return;

  let now=Date.now();
  let last=Number(d.lastUpdate)||now;

  let earned=invested*plan.rate*((now-last)/(1000*60*60*24));
  if(!isFinite(earned)||earned<=0)return;

  await updateDoc(ref,{lockedProfit:(Number(d.lockedProfit)||0)+earned,lastUpdate:now});
}

function startMining(user){
  if(miningRunning)return;
  miningRunning=true;
  const ref=doc(db,"users",user.uid);
  runMining(ref);
  setInterval(()=>runMining(ref),60000);
}

onAuthStateChanged(auth,(user)=>{
  if(!user)return location.href="login.html";

  const ref=doc(db,"users",user.uid);
  startMining(user);

  onSnapshot(ref,s=>{
    const d=s.data();
    balanceEl.innerText="$"+(Number(d.balance)||0).toFixed(2);
    profitEl.innerText="$"+(Number(d.availableProfit)||0).toFixed(2);
  });

  const tq=query(collection(db,"transactions"),where("userId","==",user.uid));
  onSnapshot(tq,s=>{
    historyEl.innerHTML="";
    s.forEach(i=>{
      const d=i.data();
      let color=d.type==="deposit"?"green":"red";
      historyEl.innerHTML+=`<div class='tx'><div class='tx-top'><b class='${color}'>${d.type.toUpperCase()}</b><span>$${Number(d.amount).toFixed(2)}</span></div><div class='gray'>${new Date(d.time).toLocaleString()}</div></div>`;
    });
  });

  const wq=query(collection(db,"withdrawals"),where("userId","==",user.uid));
  onSnapshot(wq,s=>{
    withdrawEl.innerHTML="";
    s.forEach(i=>{
      const d=i.data();
      let color=d.status==="approved"?"green":d.status==="rejected"?"red":"orange";
      withdrawEl.innerHTML+=`<div class='tx'><div class='tx-top'><b class='${color}'>${d.status.toUpperCase()}</b><span>$${Number(d.amount).toFixed(2)}</span></div><div class='gray'>${d.coin}</div></div>`;
    });
  });
});

window.goDeposit=()=>location.href="deposit.html";
window.goWithdraw=()=>location.href="withdraw.html";
window.logout=()=>signOut(auth).then(()=>location.href="login.html");
</script></body>
</html>
