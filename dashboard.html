<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{background:#02011a;color:white;}

.container{
  max-width:430px;
  margin:auto;
  padding:16px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.logo{width:70px;}
.menu{font-size:28px;cursor:pointer;}

h2{font-size:18px;margin-top:10px;}

.balance,.profit{
  font-size:22px;
  font-weight:700;
  margin:6px 0;
}

.card{
  background:#111827;
  padding:14px;
  border-radius:14px;
  margin-top:14px;
}

.ref-box{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:10px;
}

.ref-box input{
  padding:12px;
  border:none;
  border-radius:8px;
  outline:none;
}

.ref-box button{
  padding:12px;
  border:none;
  border-radius:8px;
  background:#2d2cff;
  color:white;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.actions button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:600;
  color:white;
}

.deposit{background:#2d2cff;}
.withdraw{background:#ff2d55;}

.crypto-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.coin{
  background:#0b1030;
  padding:12px;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:10px;
}

.coin img{width:26px;height:26px;}
.coin h3{font-size:15px;}

.tx{
  background:#0b1030;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}

.tx-top{display:flex;justify-content:space-between;}
.gray{color:#aaa;font-size:12px;margin-top:5px;}

.green{color:#00ff88;}
.red{color:#ff4d4d;}
.orange{color:orange;}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
  <img src="https://i.imgur.com/6VBx3io.png" class="logo">
  <div class="menu">☰</div>
</div>

<h2>Account Balance</h2>
<div id="balance" class="balance">$0.00</div>
<div id="profit" class="profit">$0.00</div>

<!-- REFERRAL -->
<div class="card">
  <h3>Referral Program</h3>
  <p>Invite users and earn commissions.</p>

  <div class="ref-box">
    <input id="refLink" value="https://stargicinvestment.com" readonly>
    <button onclick="copyRef()">Copy Link</button>
  </div>
</div>

<!-- ACTIONS -->
<div class="card actions">
  <button class="deposit" onclick="goDeposit()">Deposit</button>
  <button class="withdraw" onclick="goWithdraw()">Withdraw</button>
</div>

<!-- CRYPTO -->
<div class="card crypto-grid">
  <div class="coin"><img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png"><h3 id="btcPrice">$0</h3></div>
  <div class="coin"><img src="https://cryptologos.cc/logos/ethereum-eth-logo.png"><h3 id="ethPrice">$0</h3></div>
  <div class="coin"><img src="https://cryptologos.cc/logos/tether-usdt-logo.png"><h3 id="usdtPrice">$0</h3></div>
  <div class="coin"><img src="https://cryptologos.cc/logos/xrp-xrp-logo.png"><h3 id="xrpPrice">$0</h3></div>
</div>

<!-- TX -->
<div class="card">
  <h3>Transactions</h3>
  <div id="history"></div>
</div>

<div class="card">
  <h3>Withdraw Requests</h3>
  <div id="withdrawHistory"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth,
  onAuthStateChanged,
  signOut,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  collection,
  query,
  where,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ✅ YOUR FIREBASE CONFIG (RESTORED) */
const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* FIX LOGIN STABILITY */
setPersistence(auth, browserLocalPersistence);

/* ELEMENTS */
const balanceEl = document.getElementById("balance");
const profitEl = document.getElementById("profit");
const historyEl = document.getElementById("history");
const withdrawEl = document.getElementById("withdrawHistory");
const refLink = document.getElementById("refLink");

/* PRICES */
async function loadPrices(){
  try{
    const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether,ripple&vs_currencies=usd");
    const d = await r.json();

    btcPrice.innerText="$"+d.bitcoin.usd.toLocaleString();
    ethPrice.innerText="$"+d.ethereum.usd.toLocaleString();
    usdtPrice.innerText="$"+d.tether.usd.toLocaleString();
    xrpPrice.innerText="$"+d.ripple.usd.toLocaleString();
  }catch(e){}
}
loadPrices();
setInterval(loadPrices,30000);

/* MINING SYSTEM (FIXED SAFE) */
const plans={
  Basic:{rate:0.02},
  Silver:{rate:0.025},
  Elite:{rate:0.03},
  Premium:{rate:0.035},
  VIP:{rate:0.04}
};

async function mine(ref){
  const s = await getDoc(ref);
  if(!s.exists()) return;

  const d = s.data();

  const invested = Number(d.invested)||0;
  if(!invested || !d.plan) return;

  const plan = plans[d.plan];
  if(!plan) return;

  const now = Date.now();
  const last = Number(d.lastUpdate)||now;

  const earned = invested * plan.rate * ((now-last)/(1000*60*60*24));
  if(!earned || earned<=0) return;

  await updateDoc(ref,{
    lockedProfit:(Number(d.lockedProfit)||0)+earned,
    availableProfit:(Number(d.availableProfit)||0)+earned,
    lastUpdate:now
  });
}

function startMining(user){
  const ref = doc(db,"users",user.uid);
  mine(ref);

  // prevent multiple intervals
  if(window.miningInterval) clearInterval(window.miningInterval);

  window.miningInterval = setInterval(()=>mine(ref),60000);
}

/* AUTH FIX (NO AUTO LOGOUT BUG) */
onAuthStateChanged(auth,(user)=>{

  if(!user){
    return; // DO NOT REDIRECT IMMEDIATELY
  }

  const ref = doc(db,"users",user.uid);
  startMining(user);

  onSnapshot(ref,(s)=>{
    const d = s.data();
    if(!d) return;

    balanceEl.innerText="$"+(Number(d.balance)||0).toFixed(2);

    profitEl.innerHTML=`
      $${(Number(d.availableProfit)||0).toFixed(2)}
      <div style="font-size:12px;color:gray;">
        Mining: $${(Number(d.lockedProfit)||0).toFixed(2)}
      </div>
    `;
  });

  onSnapshot(query(collection(db,"transactions"),where("userId","==",user.uid)),(s)=>{
    historyEl.innerHTML="";
    s.forEach(i=>{
      const d=i.data();
      const color=d.type==="deposit"?"green":"red";

      historyEl.innerHTML+=`
      <div class="tx">
        <div class="tx-top">
          <b class="${color}">${d.type.toUpperCase()}</b>
          <span>$${Number(d.amount).toFixed(2)}</span>
        </div>
        <div class="gray">${new Date(d.time).toLocaleString()}</div>
      </div>`;
    });
  });

  onSnapshot(query(collection(db,"withdrawals"),where("userId","==",user.uid)),(s)=>{
    withdrawEl.innerHTML="";
    s.forEach(i=>{
      const d=i.data();
      const color=d.status==="approved"?"green":d.status==="rejected"?"red":"orange";

      withdrawEl.innerHTML+=`
      <div class="tx">
        <div class="tx-top">
          <b class="${color}">${d.status.toUpperCase()}</b>
          <span>$${Number(d.amount).toFixed(2)}</span>
        </div>
        <div class="gray">${d.coin}</div>
      </div>`;
    });
  });

});

/* ACTIONS */
window.goDeposit=()=>location.href="deposit.html";
window.goWithdraw=()=>location.href="withdraw.html";
window.copyRef=()=>navigator.clipboard.writeText(refLink.value).then(()=>alert("Copied"));
window.logout=()=>signOut(auth).then(()=>location.href="login.html");

</script>

</body>
  </html>
