<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<style>

body{
font-family:Poppins;
background:#0b0f1a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
background:#111827;
padding:40px;
border-radius:10px;
width:320px;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:5px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#00ff9d;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Create Account</h2>

<input id="name" placeholder="Full Name">

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button id="registerBtn">Register</button>

</div>


<script type="module">

// 🔥 Firebase setup
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
  getAuth, 
  createUserWithEmailAndPassword 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { 
  getFirestore, 
  doc, 
  setDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.firebasestorage.app",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


// 🚀 REGISTER FUNCTION
window.register = async function(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try{
    const userCred = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCred.user;

    // ✅ SAVE USER DATA
await setDoc(doc(db,"users",user.uid),{
  email: user.email,
  name: document.getElementById("name").value,
  balance: 0,
  invested: 0,
  availableProfit: 0,
  lockedProfit: 0,
  plan: "starter",
  startTime: Date.now(),
  lastUpdate: Date.now(),
  profitStart: Date.now(),
  depositStart: Date.now(),
  admin: false
});

    alert("Account created!");
    location.href = "dashboard.html";

  }catch(err){
    alert(err.message);
  }
};
document.getElementById("registerBtn").onclick = register;

</script>


</body>
</html>
