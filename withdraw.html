</style></head><body><h2>Withdraw</h2>

<select id="coin">
  <option value="">Select Coin</option>
  <option value="BTC">Bitcoin (BTC)</option>
  <option value="USDT">Tether (USDT)</option>
  <option value="ETH">Ethereum (ETH)</option>
  <option value="XRP">Ledger (XRP)</option>
</select><br>

<input type="text" id="wallet" placeholder="Enter wallet address"><br>

<input type="number" id="amount" placeholder="Enter amount"><br>

<button id="withdrawBtn" onclick="withdraw()">Confirm Withdraw</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 AUTH CHECK
onAuthStateChanged(auth,(user)=>{
  if(!user){
    location.href = "login.html";
  }
});

// 💰 WITHDRAW FUNCTION
let isProcessing = false;

window.withdraw = async function(){

  if(isProcessing) return;
  isProcessing = true;

  const btn = document.getElementById("withdrawBtn");
  btn.disabled = true;
  btn.innerText = "Processing...";

  try{

    const user = auth.currentUser;

    if(!user){
      alert("Login first");
      throw "stop";
    }

    const coin = document.getElementById("coin").value;
    const wallet = document.getElementById("wallet").value.trim();
    const amount = Number(document.getElementById("amount").value);

    if(!coin){
      alert("Select coin");
      throw "stop";
    }

    if(!wallet || wallet.length < 10){
      alert("Enter valid wallet address");
      throw "stop";
    }

    if(!amount || amount <= 0){
      alert("Enter valid amount");
      throw "stop";
    }

    const userRef = doc(db,"users",user.uid);
    const snap = await getDoc(userRef);

    if(!snap.exists()){
      alert("User not found");
      throw "stop";
    }

    const data = snap.data();

    if(data.admin){
      alert("Admin cannot withdraw");
      throw "stop";
    }

    let availableProfit = Number(data.availableProfit) || 0;

    if(amount > availableProfit){
      alert("Insufficient profit");
      throw "stop";
    }

    if(amount < 10){
      alert("Minimum withdraw is $10");
      throw "stop";
    }
    

const q = query(
  collection(db,"withdrawals"),
  where("userId","==",user.uid),
  where("status","==","pending")
);

const existing = await getDocs(q);

if(!existing.empty){
  alert("You already have a pending request");
  throw "stop";
  }
    

    await addDoc(collection(db, "withdrawals"), {
      userId: user.uid,
      coin,
      wallet,
      amount,
      status: "pending",
      time: Date.now()
    });

    alert("Request sent. Waiting for admin approval.");

    document.getElementById("wallet").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("coin").value = "";

  }
  catch(err){
    if(err !== "stop"){
      console.error(err);
      alert("Error occurred. Try again.");
    }
  }
  finally{
    btn.disabled = false;
    btn.innerText = "Confirm Withdraw";
    isProcessing = false;
  }
};
 </script>
