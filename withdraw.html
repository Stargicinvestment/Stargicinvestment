<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw</title><style>
body{
  background:#0b0f1a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:100px;
}

input{
  padding:10px;
  width:250px;
  margin:10px;
}

button{
  padding:10px 20px;
  background:#ff4d4d;
  border:none;
  cursor:pointer;
  color:white;
}
</style></head><body><h2>Withdraw</h2><input type="text" id="wallet" placeholder="Enter wallet address"><br>
<input type="number" id="amount" placeholder="Enter amount"><br>

<button onclick="withdraw()">Confirm Withdraw</button>

<script type="module">
import {
  getFirestore,
  doc,
  updateDoc,
  getDoc,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 AUTH CHECK
onAuthStateChanged(auth,(user)=>{
  if(!user){
    location.href = "login.html";
  }
});

// =========================
// 💰 WITHDRAW FUNCTION
// =========================
window.withdraw = async function(){

  const user = auth.currentUser;

  if(!user){
    alert("Login first");
    return;
  }

  const wallet = document.getElementById("wallet").value.trim();
  let amount = Number(document.getElementById("amount").value);

  if(!wallet){
    alert("Enter wallet address");
    return;
  }

  if(!amount || amount <= 0){
    alert("Enter valid amount");
    return;
  }

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    alert("User not found");
    return;
  }

  const data = snap.data();

  let withdrawable = Number(data.withdrawableProfit) || 0;
  let invested = Number(data.invested) || 0;
  let balance = Number(data.balance) || 0;

  let total = withdrawable + invested;

  if(amount > total){
    alert("Not enough funds");
    return;
  }

  let newWithdrawable = withdrawable;
  let newInvested = invested;

  // ✅ TAKE FROM PROFIT FIRST
  if(amount <= withdrawable){
    newWithdrawable -= amount;
  } else {
    let remaining = amount - withdrawable;
    newWithdrawable = 0;
    newInvested -= remaining;
  }

  // ✅ UPDATE FIRESTORE
  await updateDoc(userRef,{
    withdrawableProfit: newWithdrawable,
    invested: newInvested,
    balance: balance - amount
  });

  // ✅ STOP MINING IF EMPTY
  if(newInvested <= 0){
    await updateDoc(userRef,{
      plan: null
    });
  }

  // ✅ SAVE HISTORY
  await addDoc(collection(db, "withdrawals"), {
    userId: user.uid,
    wallet: wallet,
    amount: amount,
    type: "withdraw",
    date: Date.now()
  });

  alert("Withdrawal successful");
};

</script></body>
</html>
