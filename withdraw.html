<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw</title><style>
body{
  background:#0b0f1a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:100px;
}

input{
  padding:10px;
  width:250px;
  margin:10px;
}

button{
  padding:10px 20px;
  background:#ff4d4d;
  border:none;
  cursor:pointer;
  color:white;
}
</style></head><body><h2>Withdraw</h2><input type="text" id="wallet" placeholder="Enter wallet address"><br>
<input type="number" id="amount" placeholder="Enter amount"><br>

<button onclick="withdraw()">Confirm Withdraw</button>

 <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, updateDoc, getDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// AUTH CHECK
onAuthStateChanged(auth,(user)=>{
  if(!user){
    location.href = "login.html";
  }
});


// ✅ FULL WITHDRAW FUNCTION
window.withdraw = async function(){

  const user = auth.currentUser;
  if(!user){
    alert("Not logged in");
    return;
  }

  const wallet = document.getElementById("wallet").value;
  const amount = Number(document.getElementById("amount").value);

  if(!wallet){
    alert("Enter wallet address");
    return;
  }

  if(isNaN(amount) || amount <= 0){
    alert("Enter valid amount");
    return;
  }

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    alert("User not found");
    return;
  }

  const d = snap.data();

  let now = Date.now();

  let profitStart = d.profitStart ? Number(d.profitStart) : now;
  let depositStart = d.depositStart ? Number(d.depositStart) : now;

  let profitDays = (now - profitStart) / (1000 * 60 * 60 * 24);
  let depositDays = (now - depositStart) / (1000 * 60 * 60 * 24);

  let profit = Number(d.profit) || 0;
  let balance = Number(d.balance) || 0;

  // 🔴 NOTHING AVAILABLE
  if(profit <= 0 && balance <= 0){
    alert("Nothing to withdraw");
    return;
  }

  // 🟡 BEFORE 21 DAYS → ONLY PROFIT
  if(depositDays < 21){

    if(profitDays < 7){
      alert("Profit locked for 7 days");
      return;
    }

    if(amount > profit){
      alert("You can only withdraw available profit");
      return;
    }

    await updateDoc(userRef,{
      profit: profit - amount
    });

    // SAVE TRANSACTION
    await addDoc(collection(db,"transactions"),{
      userId: user.uid,
      type: "withdraw",
      amount: amount,
      wallet: wallet,
      time: Date.now()
    });

    alert("Profit withdrawal successful");
    return;
  }

  // 🟢 AFTER 21 DAYS → FULL ACCESS
  if(amount > (profit + balance)){
    alert("Insufficient funds");
    return;
  }

  let remaining = amount;

  let newProfit = profit;
  let newBalance = balance;

  if(remaining <= profit){
    newProfit -= remaining;
  }else{
    remaining -= profit;
    newProfit = 0;
    newBalance -= remaining;
  }

  await updateDoc(userRef,{
    profit: newProfit,
    balance: newBalance,
    invested: newBalance
  });

  // SAVE TRANSACTION
  await addDoc(collection(db,"transactions"),{
    userId: user.uid,
    type: "withdraw",
    amount: amount,
    wallet: wallet,
    time: Date.now()
  });

  alert("Withdrawal successful");
};

</script> 

</body>
</html>
