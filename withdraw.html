<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw</title><style>
body{
  background:#0b0f1a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:100px;
}

input{
  padding:10px;
  width:250px;
  margin:10px;
}

button{
  padding:10px 20px;
  background:#ff4d4d;
  border:none;
  cursor:pointer;
  color:white;
}
</style></head><body><h2>Withdraw</h2><input type="text" id="wallet" placeholder="Enter wallet address"><br>
<input type="number" id="amount" placeholder="Enter amount"><br>

<button onclick="withdraw()">Confirm Withdraw</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  updateDoc,
  getDoc,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 AUTH CHECK
onAuthStateChanged(auth,(user)=>{
  if(!user){
    location.href = "login.html";
  }
});

// 💰 WITHDRAW FUNCTION
window.withdraw = async function(){

  const user = auth.currentUser;
  if(!user){
    alert("Login first");
    return;
  }

  const wallet = document.getElementById("wallet").value.trim();
  const amount = Number(document.getElementById("amount").value);

  if(!wallet){
    alert("Enter wallet address");
    return;
  }

  if(!amount || amount <= 0){
    alert("Enter valid amount");
    return;
  }

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    alert("User not found");
    return;
  }

  const data = snap.data();

  let profit = Number(data.profit) || 0;
  let invested = Number(data.invested) || 0;

  let now = Date.now();

  let profitStart = Number(data.profitStart) || now;
  let depositStart = Number(data.depositStart) || now;

  let profitDays = (now - profitStart) / (1000 * 60 * 60 * 24);
  let depositDays = (now - depositStart) / (1000 * 60 * 60 * 24);

  let canWithdrawProfit = profitDays >= 7;
  let canWithdrawCapital = depositDays >= 21;

  let availableProfit = canWithdrawProfit ? profit : 0;
  let availableCapital = canWithdrawCapital ? invested : 0;

  let totalAvailable = availableProfit + availableCapital;

  if(totalAvailable <= 0){
    alert("Funds are still locked");
    return;
  }

  if(amount > totalAvailable){
    alert("Amount exceeds available funds");
    return;
  }

  let newProfit = profit;
  let newInvested = invested;

  // ✅ TAKE FROM PROFIT FIRST
  if(availableProfit > 0){
    if(amount <= availableProfit){
      newProfit -= amount;
    } else {
      let remaining = amount - availableProfit;
      newProfit = 0;
      newInvested -= remaining;
    }
  } else {
    newInvested -= amount;
  }

  await updateDoc(userRef,{
    profit: newProfit,
    invested: newInvested
  });

  // ✅ STOP MINING IF EMPTY
  if(newInvested <= 0){
    await updateDoc(userRef,{
      plan: null
    });
  }

  await addDoc(collection(db, "withdrawals"), {
    userId: user.uid,
    wallet,
    amount,
    type: "withdraw",
    date: Date.now()
  });

  alert("Withdraw successful");
};

</script></body>
</html>
