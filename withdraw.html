<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw</title><style>
body{
  background:#0b0f1a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:100px;
}

input{
  padding:10px;
  width:250px;
  margin:10px;
}

button{
  padding:10px 20px;
  background:#ff4d4d;
  border:none;
  cursor:pointer;
  color:white;
}
</style></head><body><h2>Withdraw</h2>

<select id="coin">
  <option value="">Select Coin</option>
  <option value="BTC">Bitcoin (BTC)</option>
  <option value="USDT">Tether (USDT)</option>
  <option value="ETH">Ethereum (ETH)</option>
</select><br>

<input type="text" id="wallet" placeholder="Enter wallet address"><br>

<input type="number" id="amount" placeholder="Enter amount"><br>

<button onclick="withdraw()">Confirm Withdraw</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  updateDoc,
  getDoc,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 AUTH CHECK
onAuthStateChanged(auth,(user)=>{
  if(!user){
    location.href = "login.html";
  }
});

// 💰 WITHDRAW FUNCTION
 let isProcessing = false;

window.withdraw = async function(){

  if(isProcessing) return;
  isProcessing = true;

  const user = auth.currentUser;
  if(!user){
    alert("Login first");
    isProcessing = false;
    return;
  }

  const coin = document.getElementById("coin").value;
  const wallet = document.getElementById("wallet").value.trim();
  const amount = Number(document.getElementById("amount").value);

  if(!coin){
    alert("Select coin");
    isProcessing = false;
    return;
  }

  if(!wallet){
    alert("Enter wallet address");
    isProcessing = false;
    return;
  }

  if(!amount || amount <= 0){
    alert("Enter valid amount");
    isProcessing = false;
    return;
  }

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);
  const data = snap.data();

  let availableProfit = Number(data.availableProfit) || 0;

  if(amount > availableProfit){
    alert("Insufficient profit");
    isProcessing = false;
    return;
  }

  // ✅ CREATE REQUEST ONLY (NO MONEY DEDUCTED)
  await addDoc(collection(db, "withdrawals"), {
    userId: user.uid,
    coin,
    wallet,
    amount,
    status: "pending",
    time: Date.now()
  });

  alert("Request sent. Waiting for admin approval.");

  isProcessing = false;
};




</script></body>
</html>
