<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw</title><style>

  color:white;

}

</style></head><body><h2>Withdraw</h2><input type="text" id="wallet" placeholder="Enter wallet address"><br>
<input type="number" id="amount" placeholder="Enter amount"><br>

<button onclick="withdraw()">Confirm Withdraw</button>

 <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, updateDoc, getDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_fVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// AUTH CHECK
onAuthStateChanged(auth,(user)=>{
  if(!user){
    location.href = "login.html";
  }
});


// ✅ FULL WITHDRAW FUNCTION

  window.withdraw = async function(){

  const user = auth.currentUser;

  if(!user){
    alert("Login first");
    return;
  }

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    alert("User data not found");
    return;
  }

  const data = snap.data();

  const now = Date.now();

  const profitStart = Number(data.profitStart) || now;
  const depositStart = Number(data.depositStart) || now;

  const profitDays = (now - profitStart) / (1000 * 60 * 60 * 24);
  const depositDays = (now - depositStart) / (1000 * 60 * 60 * 24);

  const profit = Number(data.profit) || 0;
  const invested = Number(data.invested) || 0;

  // =========================
  // ✅ PROFIT WITHDRAW (7 DAYS)
  // =========================
  if(profitDays >= 7){

    if(profit <= 0){
      alert("No profit available");
      return;
    }

    await updateDoc(userRef,{
      profit: 0,
      profitStart: Date.now()
    });

    alert("Profit withdrawal successful");
    return;
  }

  // =========================
  // ✅ CAPITAL WITHDRAW (21 DAYS)
  // =========================
  if(depositDays >= 21){

    if(invested <= 0){
      alert("No active investment");
      return;
    }

    await updateDoc(userRef,{
      balance: 0,
      invested: 0,
      profit: 0,
      depositStart: Date.now(),
      profitStart: Date.now()
    });

    alert("Capital withdrawn successfully");
    return;
  }

  // =========================
  // ❌ NOT READY
  // =========================
  alert("Withdrawal not available yet");
};
   <script>

</body>
</html>
