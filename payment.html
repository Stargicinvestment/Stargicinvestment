<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>

<style>
body{
  margin:0;
  font-family:Poppins, sans-serif;
  background: radial-gradient(circle at top, #0f3d2e, #050505 70%);
  color:#fff;
  text-align:center;
  padding:20px;
}

/* COIN IMAGE */
.coin-img{
  width:100px;
  margin-top:30px;
}

/* TEXT */
.title{
  margin-top:20px;
  font-size:18px;
  color:#aaa;
}

.amount{
  font-size:36px;
  color:#00ffae;
  margin:10px 0;
  font-weight:600;
}

/* QR */
.qr{
  width:100%;
  max-width:260px;
  margin:30px auto;
  border-radius:12px;
  background:#fff;
  padding:10px;
}

/* WALLET */
.wallet{
  background:#111;
  padding:15px;
  border-radius:10px;
  word-break:break-all;
  margin-top:20px;
  font-size:14px;
  position:relative;
}

/* NETWORK NOTE */
.note{
  margin-top:8px;
  font-size:13px;
  color:#ffcc00;
}

/* BUTTON */
.copy-btn{
  margin-top:15px;
  padding:14px 25px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:linear-gradient(135deg,#00ffae,#00c3ff);
  color:#000;
  font-weight:500;
}
</style>
</head>

<body>

<img id="coinImage" class="coin-img">

<div class="title" id="titleText"></div>
<div class="amount" id="amountText"></div>

<img id="qrCode" class="qr">

<div class="wallet" id="wallet"></div>
<div class="note" id="networkNote"></div>

<button class="copy-btn" onclick="copyWallet()">Copy Address</button>

<script>

// GET DATA FROM URL
const params = new URLSearchParams(window.location.search);
const coin = params.get("coin");
const amount = params.get("amount");

// WALLET ADDRESSES
const wallets = {
  "Bitcoin (BTC)": {
    address: "196jxoawfauaQur3ztAwgmAi1X34qy4paT",
    note: "Send ONLY BTC network"
  },
  "Ethereum (ETH)": {
    address: "0x85954ac3953cfd390f6c27c41cfea6a62bd149c7",
    note: "Send ONLY BEP20 (BNB network)"
  },
  "USDT (BEP20)": {
    address: "0x85954ac3953cfd390f6c27c41cfea6a62bd149c7",
    note: "Send ONLY BEP20 (BNB network)"
  }
};

// IMAGES
const images = {
  "Bitcoin (BTC)": "https://cryptologos.cc/logos/bitcoin-btc-logo.png",
  "Ethereum (ETH)": "https://cryptologos.cc/logos/ethereum-eth-logo.png",
  "USDT (BEP20)": "https://cryptologos.cc/logos/tether-usdt-logo.png"
};

// ELEMENTS
const coinImage = document.getElementById("coinImage");
const titleText = document.getElementById("titleText");
const amountText = document.getElementById("amountText");
const walletBox = document.getElementById("wallet");
const qrCode = document.getElementById("qrCode");
const networkNote = document.getElementById("networkNote");

// VALIDATION
if (!coin || !amount || !wallets[coin]) {
  titleText.textContent = "Invalid payment request";
  throw new Error("Invalid payment data");
}

// DATA
const wallet = wallets[coin].address;

// DISPLAY INFO
coinImage.src = images[coin];
titleText.textContent = `Deposit ${coin}`;
amountText.textContent = `$${amount}`;
walletBox.textContent = wallet;
networkNote.textContent = wallets[coin].note;

// 🔥 QR PAYMENT FORMAT (IMPROVED)
let qrData = wallet;

// Bitcoin format
if (coin.includes("Bitcoin")) {
  qrData = `bitcoin:${wallet}?amount=${amount}`;
}

// Ethereum / USDT format (wallet dependent support)
if (coin.includes("Ethereum") || coin.includes("USDT")) {
  qrData = `ethereum:${wallet}?value=${amount}`;
}

// ENCODE QR SAFELY
qrCode.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(qrData)}`;

// COPY FUNCTION
function copyWallet() {
  navigator.clipboard.writeText(wallet);
  alert("Wallet address copied!");
}

</script>

</body>
</html>
